<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مشواري</title>
<meta name="theme-color" content="#16202C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Shell: ink header band with the day's net, scrolling sheet of cards, fixed bottom nav; forms open as bottom sheets */
:root{
  --ink:#16202C; --ink-2:#22303F; --on-ink:#F2F5F8; --on-ink-2:#9FB0C2;
  --bg:#E9EDF1; --card:#FFFFFF; --line:#DCE2E8; --fg:#16202C; --muted:#64748A;
  --sun:#FFC23D; --sun-ink:#2A1F00;
  --money:#0F7B57; --money-soft:#DDF1E8; --fare:#C2410C; --fare-soft:#FCE9DE;
  --warn:#9A6700; --off:#8A96A3; --danger:#B42318;
  --head:"Cairo","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Cairo",Tahoma,"Segoe UI",sans-serif;
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --ink:#0B1118; --ink-2:#17212C; --on-ink:#EEF2F6; --on-ink-2:#8EA0B3;
  --bg:#0F151C; --card:#18212B; --line:#26313D; --fg:#E7ECF1; --muted:#93A3B4;
  --money:#46C996; --money-soft:#123327; --fare:#F08A55; --fare-soft:#3A2116;
  --warn:#E8B44A; --off:#6B7785; --danger:#F28B82; color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;overscroll-behavior-y:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--fg)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* header */
.top{background:var(--ink);color:var(--on-ink);padding:calc(env(safe-area-inset-top,0px) + 14px) max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));border-radius:0 0 26px 26px;position:relative}
.top .brand{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--on-ink-2)}
.top .brand b{font-family:var(--head);font-weight:800;color:var(--sun);font-size:1rem;letter-spacing:.01em}
.top h1{font-family:var(--head);font-weight:800;font-size:1.65rem;margin:6px 0 0;line-height:1.25}
.top .sub{color:var(--on-ink-2);font-size:.85rem}
.datebar{display:flex;align-items:center;gap:8px;margin-top:4px}
.datebar .t{flex:1;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--ink-2);color:var(--on-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.strip div{background:var(--ink-2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.strip span{font-size:.72rem;color:var(--on-ink-2)}
.strip b{font-family:var(--head);font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.strip .net b{color:var(--sun)}

/* main */
main{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 2px -4px}
.sec-h h2{font-family:var(--head);font-weight:700;font-size:1.05rem;margin:0}
.link{border:0;background:none;color:var(--money);font-weight:600;cursor:pointer;padding:6px 4px}
.card{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* schedule timeline */
.slots{display:flex;flex-direction:column;gap:10px}
.slot{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:right;width:100%}
.slot .time{display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:2px dashed var(--line);padding-left:10px;font-variant-numeric:tabular-nums}
.slot .time b{font-family:var(--head);font-size:1.15rem;font-weight:700;line-height:1.1}
.slot .time span{font-size:.72rem;color:var(--muted)}
.slot .info{min-width:0;display:flex;flex-direction:column;gap:6px}
.slot .name{font-weight:600;font-size:1rem;display:flex;gap:8px;align-items:center;justify-content:space-between}
.slot .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.slot .meta{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .acts{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--fg)}
.st{font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px;flex:none}
.st.wait{background:var(--bg);color:var(--muted)}
.st.done{background:var(--money-soft);color:var(--money)}
.st.off{background:var(--fare-soft);color:var(--fare)}
.slot.is-off{opacity:.6}
.slot.is-off .name span{text-decoration:line-through}
.slot.now{border-color:var(--sun);box-shadow:0 0 0 2px color-mix(in srgb,var(--sun) 35%,transparent)}
.rep{font-size:.7rem;color:var(--muted)}

.empty{text-align:center;padding:22px 12px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-family:var(--head);font-size:1rem}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--bg);color:var(--fg)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ink{background:var(--ink);color:var(--on-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:focus-visible,.pill:focus-visible,.iconbtn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

/* fares */
.fares{display:flex;flex-direction:column}
.fare{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.fare:last-child{border-bottom:0}
.fare .amt{font-family:var(--head);font-weight:700;color:var(--fare);min-width:56px;font-variant-numeric:tabular-nums}
.fare .nt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer;width:36px;height:36px;border-radius:10px}
.daytoggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--money)}
.switch input:checked+span::after{right:23px}
textarea.note{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:60px;resize:vertical}

/* centers */
.center{display:flex;flex-direction:column;gap:8px}
.center .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.center .h b{font-size:1.02rem}
.center .meta{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.tag{font-size:.72rem;font-weight:700;background:var(--money-soft);color:var(--money);border-radius:999px;padding:2px 8px;flex:none}
.weekdots{display:flex;gap:4px;flex-wrap:wrap}
.weekdots i{font-style:normal;font-size:.72rem;padding:1px 7px;border-radius:6px;background:var(--bg);color:var(--muted)}
.weekdots i.on{background:var(--ink);color:var(--on-ink)}

/* reports */
.periods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.periods button{border:0;background:transparent;border-radius:10px;padding:9px 4px;font-weight:600;color:var(--muted);cursor:pointer}
.periods button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.big{display:flex;flex-direction:column;gap:2px}
.big .lbl{font-size:.8rem;color:var(--muted)}
.big .v{font-family:var(--head);font-weight:800;font-size:2.2rem;color:var(--money);line-height:1.2;font-variant-numeric:tabular-nums}
.big .v small{font-size:.9rem;font-weight:600;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.split div{display:flex;flex-direction:column}
.split span{font-size:.74rem;color:var(--muted)}
.split b{font-family:var(--head);font-weight:700;font-variant-numeric:tabular-nums}
.split .f b{color:var(--fare)}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:12px}
.bars i{flex:1;background:var(--money);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.bars i.zero{background:var(--line)}
.mnav{display:flex;align-items:center;gap:8px}
.mnav h3{flex:1;text-align:center;margin:0;font-family:var(--head);font-size:1rem}
.mnav .iconbtn{background:var(--bg);color:var(--fg)}
.drow{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-top:0;width:100%;text-align:right}
.drow:last-child{border-bottom:0}
.drow .d{display:flex;flex-direction:column;align-items:center;background:var(--bg);border-radius:10px;padding:3px 0}
.drow .d b{font-family:var(--head);font-size:1.05rem;line-height:1.2}
.drow .d span{font-size:.66rem;color:var(--muted)}
.drow .c{min-width:0;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .m{text-align:left;font-variant-numeric:tabular-nums;font-size:.85rem;line-height:1.3}
.drow .m b{color:var(--money);font-family:var(--head)}
.drow .m span{display:block;color:var(--fare);font-size:.74rem}
.crow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.crow:last-child{border-bottom:0}

/* settings */
.field{display:flex;flex-direction:column;gap:6px;font-size:.84rem;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%;font-size:1rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}

/* bottom nav */
.nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:.74rem;font-weight:600;cursor:pointer;border-radius:12px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] .ic{background:var(--sun);color:var(--sun-ink)}
.nav .ic{width:52px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.fab{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(22,32,44,.28);cursor:pointer;z-index:19}
.fab svg{width:28px;height:28px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,22,.5);z-index:40;opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{position:fixed;inset:auto 0 0 0;background:var(--card);border-radius:24px 24px 0 0;z-index:41;max-height:90%;overflow:auto;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .25s ease;max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sheet h3{font-family:var(--head);font-size:1.2rem;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 4px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"].wait{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.seg button[aria-pressed="true"].done{background:var(--money);color:#fff;border-color:var(--money)}
.seg button[aria-pressed="true"].off{background:var(--fare);color:#fff;border-color:var(--fare)}
.check{display:flex;align-items:center;gap:10px;font-size:.92rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--money)}
.sheet .foot{display:flex;gap:8px;margin-top:16px}
.sheet .foot .btn{flex:1}
.confirm{background:var(--fare-soft);color:var(--fare);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.confirm div{display:flex;gap:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:12px;font-weight:600;z-index:60;font-size:.9rem;white-space:nowrap}
.install{background:var(--sun);color:var(--sun-ink);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px}
.install p{margin:0;flex:1;font-size:.88rem;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top" id="top"></header>
<main id="main"></main>

<button class="fab" id="fab" aria-label="ضيف سنتر لجدول اليوم"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="nav" id="nav">
  <button data-v="today" aria-current="page"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></svg></span>النهارده</button>
  <button data-v="centers"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>السناتر</button>
  <button data-v="money"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>الحساب</button>
  <button data-v="settings"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span>الإعدادات</button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ================= storage ================= */
const KEY="mishwari:v1";
const DEF={rate:150,centers:[],days:{},weekly:{}};
let S;
try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S={...DEF}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("المساحة مليانة، الحفظ ما نجحش")}}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const DAYS=["الأحد","الاتنين","التلات","الأربع","الخميس","الجمعة","السبت"];
const DSHORT=["أحد","اتنين","تلات","أربع","خميس","جمعة","سبت"];
const WEEK_ORDER=[6,0,1,2,3,4,5];
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{n=Math.round((+n||0)*100)/100;return n.toLocaleString("en-US")};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const weekStart=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+1)%7));return ymd(d)};
function t12(hm){if(!hm)return{h:"--",p:""};let[h,m]=hm.split(":").map(Number);const p=h<12?"ص":"م";h=h%12||12;return{h:h+":"+String(m).padStart(2,"0"),p}}
const tStr=hm=>{const x=t12(hm);return x.h+" "+x.p};
const center=id=>S.centers.find(c=>c.id===id);
function mapHref(loc){if(!loc)return"";loc=loc.trim();return/^https?:\/\//i.test(loc)?loc:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(loc)}
const fareSum=d=>(d?.transport||[]).reduce((a,t)=>a+(+t.amount||0),0);
const wageOf=d=>d&&d.worked!==false?(+d.wage||0):0;
function totals(list){let w=0,f=0,n=0;list.forEach(d=>{w+=wageOf(d);f+=fareSum(d);if(d.worked!==false)n++});return{w,f,net:w-f,days:n}}
const daysIn=(a,b)=>Object.values(S.days).filter(d=>d.date>=a&&d.date<=b);
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}
const ICON={
  map:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg>',
  call:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',

/* ================= Web Push ================= */
const VAPID_PUBLIC="BFfZJep0Ysf6-mytm5H87B_CZar5yNIkf8LJwSDCrut2W54eoa6SkaRu7MkrawC4UJj9L1OfLUcELEq_jxpXDHs";
const urlB64ToU8A=b64=>{const p=b64.replace(/-/g,"+").replace(/_/g,"/");const raw=atob(p+"=".repeat((4-p.length%4)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0))};
async function pushState(){
  const out={supported:"Notification" in window&&"PushManager" in window,perm:"denied",sub:null,sw:false};
  if(!out.supported)return out;
  out.perm=Notification.permission;
  try{const regs=await navigator.serviceWorker.getRegistrations();out.sw=regs.length>0;if(out.sw&&out.perm==="granted"){const r=regs[0];out.sub=await r.pushManager.getSubscription()}}catch(e){}
  return out;
}
async function enablePush(){
  const perm=await Notification.requestPermission();
  if(perm!=="granted"){toast("محتاجين إذن الإشعارات من المتصفح");await refreshPushBox();return}
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToU8A(VAPID_PUBLIC)});
    S.notif=Object.assign({},S.notif,{enabled:true,endpoint:sub.endpoint,key:sub.getKey?sub.getKey("p256dh"):null,auth:sub.getKey?sub.getKey("auth"):null,at:Date.now()});
    save();toast("تم تفعيل الإشعارات ✅");await refreshPushBox();
  }catch(e){toast("مش قادرين نشترك دلوقتي: "+e.message)}
}
async function disablePush(){
  try{const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){const s=await r.pushManager.getSubscription();if(s)await s.unsubscribe()}}catch(e){}
  S.notif=Object.assign({},S.notif,{enabled:false,endpoint:null});
  save();toast("الإشعارات اتقفلت");await refreshPushBox();
}
async function testNotification(){
  try{
    const reg=await navigator.serviceWorker.ready;
    await reg.showNotification("مشواري · إشعار تجريبي",{body:"لو شفت الرسالة دي، يبقى مسار الإشعارات شغال ✅",icon:"icon-192.png",badge:"icon-192.png",tag:"mishwari-test",dir:"rtl",lang:"ar",vibrate:[120,60,120],data:{url:"./"}});
  }catch(e){toast("مقدرناش نبيّن الإشعار: "+e.message)}
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast("اتنسخ ✅")}catch(e){
    const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("اتنسخ ✅")}catch(_){toast("انسخ يدوي")}ta.remove();
  }
}
function pushBoxHtml(s){
  if(!s.supported)return `<div class="card"><span class="muted small">المتصفح ده مش بيدعم إشعارات Web Push. جرّب كروم.</span></div>`;
  if(s.perm==="denied")return `<div class="card stack">
    <div class="confirm" style="background:var(--fare-soft);color:var(--fare)"><span>الإذن مرفوض. علشان تشغّل الإشعارات: افتح إعدادات المتصفح ← الإشعارات ← اسم الموقع ← Allow، وبعدين افتح التطبيق تاني.</span></div>
    <button class="btn ghost" id="pushCheck">راجع الإذن تاني</button></div>`;
  if(s.perm==="default")return `<div class="card stack">
    <span class="muted small">الإشعارات مقفولة. لما تفعّلها هتستقبل تنبيه بجدول النهارده وقبل أي ميعاد بساعة.</span>
    <button class="btn sun" id="pushOn">فعّل الإشعارات</button></div>`;
  if(!s.sub)return `<div class="card stack">
    <span class="muted small">الإذن اتسمح، بس الاشتراك لسه مش مكتمل. (محتاج الـ service worker يكون جاهز — اعمل refresh مرة واحدة.)</span>
    <button class="btn sun" id="pushOn">كمّل الاشتراك</button></div>`;
  const ep=(s.sub.endpoint||"").slice(-28);
  return `<div class="card stack">
    <div class="daytoggle"><div><b>الإشعارات مفعّلة</b><div class="muted small">مسجّل كـ Push Subscription ✅</div></div>
      <label class="switch"><input type="checkbox" id="pushToggle" checked aria-label="فعّل الإشعارات"><span></span></label></div>
    <div class="field">موعد التذكير اليومي<input type="time" id="pushHour" value="${S.notif&&S.notif.hour!=null?S.notif.hour:8}"></div>
    <label class="check"><input type="checkbox" id="pushBefore" ${S.notif&&S.notif.before!==false?"checked":""}> تنبيه قبل أي ميعاد بساعة</label>
    <div class="row"><button class="btn ink" id="pushTest">اختبار إشعار</button><button class="btn ghost" id="pushCopy">نسخ بيانات الاشتراك</button></div>
    <span class="muted small">الاشتراك بيبدأ بـ …${esc(ep)}</span>
    <span class="muted small">عشان السيرفر يقدر يبعت، بيانات الاشتراك لازم تتسجل عنده (الخطوة الجاية).</span>
    <button class="btn danger" id="pushOff">إلغاء الاشتراك</button></div>`;
}
async function refreshPushBox(){
  const el=document.querySelector("#pushBox");if(!el)return;
  const s=await pushState();el.innerHTML=pushBoxHtml(s);
  const on=document.querySelector("#pushOn");on&&(on.onclick=enablePush);
  const off=document.querySelector("#pushOff");off&&(off.onclick=disablePush);
  const chk=document.querySelector("#pushCheck");chk&&(chk.onclick=refreshPushBox);
  const tst=document.querySelector("#pushTest");tst&&(tst.onclick=testNotification);
  const cp=document.querySelector("#pushCopy");cp&&(cp.onclick=()=>copyText(JSON.stringify({endpoint:s.sub.endpoint,keys:{p256dh:s.sub.getKey("p256dh"),auth:s.sub.getKey("auth")}},null,1)));
  const tg=document.querySelector("#pushToggle");tg&&(tg.onchange=()=>{tg.checked?enablePush():disablePush()});
  const hr=document.querySelector("#pushHour");hr&&(hr.onchange=()=>{S.notif=Object.assign({},S.notif,{hour:+hr.value});save();toast("التذكير اليومي الساعة "+hr.value)});
  const bf=document.querySelector("#pushBefore");bf&&(bf.onchange=()=>{S.notif=Object.assign({},S.notif,{before:bf.checked});save()});
}

/* ================= day model ================= */
let view="today", cur=today(), period="month", month=today().slice(0,7);
function getDay(date){return S.days[date]}
function ensureDay(date){
  if(!S.days[date])S.days[date]={date,worked:true,wage:S.rate,items:[],transport:[],note:""};
  return S.days[date];
}
function cleanupDay(date){const d=S.days[date];if(d&&!d.items.length&&!d.transport.length&&!d.note&&d.worked!==false&&d.wage===S.rate&&!d.touched)delete S.days[date]}
function template(date){return S.weekly[parse(date).getDay()]||[]}

/* ================= render: header ================= */

/* ================= render: today ================= */
function nowMinutes(){const n=new Date();return n.getHours()*60+n.getMinutes()}
const mins=hm=>{if(!hm)return-1;const[h,m]=hm.split(":").map(Number);return h*60+m};
function renderToday(){
  const d=getDay(cur), tpl=template(cur), wd=parse(cur).getDay();
  const items=(d?.items||[]).slice().sort((a,b)=>(a.start||"99").localeCompare(b.start||"99"));

  if(!items.length){
    if(tpl.length){
      h+=`<div class="card empty"><b>عندك جدول ${DAYS[wd]} المعتاد</b><span>${tpl.map(t=>esc(center(t.centerId)?.name||"سنتر")+" "+tStr(t.start)).join(" · ")}</span><button class="btn sun" id="useTpl">حطه في جدول اليوم</button></div>`;
    }else{
      h+=`<div class="card empty"><b>مفيش مواعيد متسجلة لليوم ده</b><span>${S.centers.length?"دوس على زرار + وضيف السنتر وميعاده.":"ابدأ بإضافة السناتر بتاعتك من تاب السناتر، وبعدين حط مواعيدها هنا."}</span>${S.centers.length?`<button class="btn sun" id="addSlot2">+ ضيف ميعاد</button>`:`<button class="btn ink" id="goCenters">روح للسناتر</button>`}</div>`;
    }
  }else{
    const nm=nowMinutes(),isT=cur===today();
    h+='<div class="slots">'+items.map(it=>{
      const c=center(it.centerId)||{name:"سنتر اتمسح"};const s=t12(it.start);
      const now=isT&&(it.status||"wait")==="wait"&&mins(it.start)<=nm&&nm<(it.end?mins(it.end):mins(it.start)+120);
      const st={wait:["wait","لسه"],done:["done","خلصت"],off:["off","اتلغى"]}[it.status||"wait"];
      const href=mapHref(c.location);
      return`<div class="slot ${it.status==="off"?"is-off":""} ${now?"now":""}" data-id="${it.id}" role="button" tabindex="0">
        <div class="time"><b>${s.h}</b><span>${s.p}${it.end?" · لحد "+tStr(it.end):""}</span></div>
        <div class="info">
          <div class="name"><span>${esc(c.name)}</span><span class="st ${st[0]}">${now?"دلوقتي":st[1]}</span></div>
          ${c.area||it.note?`<div class="meta">${esc([c.area,it.note].filter(Boolean).join(" · "))}</div>`:""}
          <div class="acts">
            <button class="pill" data-cycle="${it.id}">${it.status==="done"?"↺ رجّعها لسه":"✓ خلصت"}</button>
            ${href?`<a class="pill" href="${esc(href)}" target="_blank" rel="noopener">${ICON.map} الخريطة</a>`:""}
            ${c.phone?`<a class="pill" href="tel:${esc(c.phone.replace(/[^\d+]/g,""))}">${ICON.call} اتصل</a>`:""}
            ${it.repeat?`<span class="rep">↻ كل ${DAYS[wd]}</span>`:""}
          </div>
        </div></div>`}).join("")+'</div>';
  }
  /* fares */
  const tr=d?.transport||[];
  h+=`<div class="sec-h"><h2>المواصلات</h2><button class="link" id="addFare">+ ضيف مشوار</button></div>

  /* day */
  h+=`<div class="sec-h"><h2>اليوم</h2></div>
  <div class="card stack">

    <label class="switch"><input type="checkbox" id="worked" ${!d||d.worked!==false?"checked":""} aria-label="اليومية محسوبة"><span></span></label></div>

  let nt;$("#note").oninput=e=>{clearTimeout(nt);nt=setTimeout(()=>{const day=ensureDay(cur);day.note=e.target.value.trim();cleanupDay(cur);save()},400)};

/* ================= sheets ================= */
function openSheet(html,bind){
  $("#sheetBody").innerHTML=html;const sc=$("#scrim"),sh=$("#sheet");
  sc.hidden=false;sh.hidden=false;requestAnimationFrame(()=>{sc.classList.add("open");sh.classList.add("open")});
  bind&&bind();sc.onclick=closeSheet;
  const f=sh.querySelector("[data-autofocus]");f&&setTimeout(()=>f.focus(),260);
}
function closeSheet(){const sc=$("#scrim"),sh=$("#sheet");sc.classList.remove("open");sh.classList.remove("open");setTimeout(()=>{sc.hidden=true;sh.hidden=true},250)}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet()});

function slotSheet(id){
  if(!S.centers.length){toast("ضيف سنتر الأول");go("centers");return}
  const day=getDay(cur);const it=id?day.items.find(i=>i.id===id):null;
  const wd=parse(cur).getDay();
  let sel=it?it.centerId:(S.centers.length===1?S.centers[0].id:null),status=it?.status||"wait";
  const origCenter=it?.centerId,origStart=it?.start;
  openSheet(`<h3>${it?"تعديل الميعاد":"ميعاد جديد"}</h3>
  <div class="stack">
    <div class="field">السنتر<div class="chips" id="cChips">${S.centers.map(c=>`<button type="button" class="chip" data-c="${c.id}" aria-pressed="${c.id===sel}">${esc(c.name)}</button>`).join("")}</div></div>
    <div class="row"><label class="field">من<input type="time" id="sStart" value="${it?.start||""}"></label><label class="field">لحد<input type="time" id="sEnd" value="${it?.end||""}"></label></div>
    <label class="field">ملاحظة<input id="sNote" value="${esc(it?.note||"")}" placeholder="مثلاً: مستر أحمد، تالتة ثانوي"></label>
    ${it?`<div class="field">الحالة<div class="seg" id="sSeg"><button type="button" class="wait" data-s="wait" aria-pressed="${status==="wait"}">لسه</button><button type="button" class="done" data-s="done" aria-pressed="${status==="done"}">خلصت</button><button type="button" class="off" data-s="off" aria-pressed="${status==="off"}">اتلغى</button></div></div>`:""}
    <label class="check"><input type="checkbox" id="sRep" ${it?.repeat?"checked":""}> كرر الميعاد ده كل ${DAYS[wd]}</label>
    <div id="sConfirm" class="confirm" hidden><span>هتمسح الميعاد ده من اليوم؟</span><div><button class="btn danger" id="sDelYes" type="button">أيوه امسح</button><button class="btn ghost" id="sDelNo" type="button">لا</button></div></div>
  </div>
  <div class="foot"><button class="btn sun" id="sSave" type="button">${it?"احفظ":"ضيف للجدول"}</button>${it?`<button class="btn danger" id="sDel" type="button">امسح</button>`:`<button class="btn ghost" id="sCancel" type="button">إلغاء</button>`}</div>`,()=>{
    document.querySelectorAll("#cChips .chip").forEach(b=>b.onclick=()=>{sel=b.dataset.c;document.querySelectorAll("#cChips .chip").forEach(x=>x.setAttribute("aria-pressed",x===b))});
    document.querySelectorAll("#sSeg button").forEach(b=>b.onclick=()=>{status=b.dataset.s;document.querySelectorAll("#sSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
    $("#sCancel")&&($("#sCancel").onclick=closeSheet);
    $("#sDel")&&($("#sDel").onclick=()=>$("#sConfirm").hidden=false);
    $("#sDelNo")&&($("#sDelNo").onclick=()=>$("#sConfirm").hidden=true);
    $("#sDelYes")&&($("#sDelYes").onclick=()=>{day.items=day.items.filter(i=>i.id!==id);cleanupDay(cur);save();closeSheet();render();toast("اتمسح الميعاد")});
    $("#sSave").onclick=()=>{
      if(!sel){toast("اختار السنتر");return}
      const start=$("#sStart").value,end=$("#sEnd").value;
      if(!start){toast("حط ميعاد البداية");$("#sStart").focus();return}
      if(end&&end<=start){toast("ميعاد النهاية لازم يكون بعد البداية");return}
      const d=ensureDay(cur);const rep=$("#sRep").checked;
      const data={centerId:sel,start,end,note:$("#sNote").value.trim(),status,repeat:rep};
      let item=it;if(item)Object.assign(item,data);else{item={id:uid(),...data};d.items.push(item)}
      /* weekly template */
      const list=(S.weekly[wd]||[]).filter(t=>!(it&&t.centerId===origCenter&&t.start===origStart)&&!(t.centerId===sel&&t.start===start));
      if(rep)list.push({centerId:sel,start,end});
      list.sort((a,b)=>a.start.localeCompare(b.start));S.weekly[wd]=list;
      save();closeSheet();render();toast(it?"اتحفظ الميعاد":"اتضاف "+(center(sel)?.name||"")+" "+tStr(start));
    };
  });
}

  let amt="",note="";
  const QA=[5,7,10,12,15,20,25,30,50];const QN=["ميكروباص","توكتوك","مترو","أتوبيس","تاكسي","أوبر"];

    <label class="field">رايح فين / بإيه<input id="fNote" placeholder="مثلاً: ميكروباص لسنتر النور"></label>
    <div class="chips">${QN.map(n=>`<button type="button" class="chip" data-n="${n}">${n}</button>`).join("")}</div>
  </div><div class="foot"><button class="btn sun" id="fSave" type="button">سجل المشوار</button><button class="btn ghost" id="fCancel" type="button">إلغاء</button></div>`,()=>{
    document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{$("#fAmt").value=b.dataset.a});

    $("#fCancel").onclick=closeSheet;
    $("#fSave").onclick=()=>{const a=+$("#fAmt").value;if(!(a>0)){toast("اكتب المبلغ");$("#fAmt").focus();return}
      const d=ensureDay(cur);d.transport.push({id:uid(),amount:a,note:$("#fNote").value.trim()});save();closeSheet();render();toast("اتسجل "+fmt(a)+" ج.م مواصلات")};
  });
}

function centerSheet(id){
  const c=id?center(id):null;
  openSheet(`<h3>${c?"تعديل "+esc(c.name):"سنتر جديد"}</h3><div class="stack">
    <label class="field">اسم السنتر<input id="cName" value="${esc(c?.name||"")}" placeholder="مثلاً: سنتر النور" data-autofocus></label>
    <div class="row"><label class="field">المنطقة<input id="cArea" value="${esc(c?.area||"")}" placeholder="مدينة نصر"></label>
    <label class="field">رقم التليفون<input id="cPhone" inputmode="tel" class="num" dir="ltr" value="${esc(c?.phone||"")}" placeholder="01xxxxxxxxx"></label></div>
    <label class="field">اللوكيشن<input id="cLoc" value="${esc(c?.location||"")}" placeholder="الصق لينك جوجل ماب أو اكتب العنوان"></label>
    <span class="muted small" style="margin-top:-6px">من جوجل ماب: افتح المكان ← مشاركة ← نسخ الرابط، وبعدين الصقه هنا.</span>
    <label class="field">ملاحظات<input id="cNote" value="${esc(c?.note||"")}" placeholder="اسم المدرس، الدور، أقرب محطة"></label>
    <div id="cConfirm" class="confirm" hidden><span>هتمسح "${esc(c?.name||"")}"؟ الأيام اللي فاتت هتفضل محسوبة.</span><div><button class="btn danger" id="cDelYes" type="button">أيوه امسح</button><button class="btn ghost" id="cDelNo" type="button">لا</button></div></div>
  </div><div class="foot"><button class="btn sun" id="cSave" type="button">${c?"احفظ":"ضيف السنتر"}</button>${c?`<button class="btn danger" id="cDel" type="button">امسح</button>`:`<button class="btn ghost" id="cCancel" type="button">إلغاء</button>`}</div>`,()=>{
    $("#cCancel")&&($("#cCancel").onclick=closeSheet);
    $("#cDel")&&($("#cDel").onclick=()=>$("#cConfirm").hidden=false);
    $("#cDelNo")&&($("#cDelNo").onclick=()=>$("#cConfirm").hidden=true);
    $("#cDelYes")&&($("#cDelYes").onclick=()=>{S.centers=S.centers.filter(x=>x.id!==id);Object.keys(S.weekly).forEach(k=>S.weekly[k]=S.weekly[k].filter(t=>t.centerId!==id));save();closeSheet();render();toast("اتمسح السنتر")});
    $("#cSave").onclick=()=>{const name=$("#cName").value.trim();if(!name){toast("اكتب اسم السنتر");$("#cName").focus();return}
      const data={name,area:$("#cArea").value.trim(),phone:$("#cPhone").value.trim(),location:$("#cLoc").value.trim(),note:$("#cNote").value.trim()};
      if(c)Object.assign(c,data);else S.centers.push({id:uid(),...data});save();closeSheet();render();toast(c?"اتحفظ "+name:"اتضاف "+name)};
  });
}

/* ================= render: centers ================= */
function renderCenters(){
  const mk=today().slice(0,7);
  let h=`<div class="sec-h"><h2>أماكن الشغل</h2><button class="link" id="addC">+ سنتر جديد</button></div>`;
  if(!S.centers.length){h+=`<div class="card empty"><b>لسه مفيش سناتر</b><span>ضيف كل سنتر بتروحه ومعاه لينك الخريطة ورقم التليفون، علشان توصله وتكلمه بدوسة.</span><button class="btn sun" id="addC2">+ ضيف أول سنتر</button></div>`}
  else h+=S.centers.map(c=>{
    const visits=Object.values(S.days).filter(d=>d.date.startsWith(mk)&&d.items.some(i=>i.centerId===c.id&&i.status!=="off")).length;
    const wdays=WEEK_ORDER.filter(w=>(S.weekly[w]||[]).some(t=>t.centerId===c.id));
    const href=mapHref(c.location);
    return`<div class="card center"><div class="h"><div><b>${esc(c.name)}</b>${c.area?`<div class="meta">${esc(c.area)}</div>`:""}</div>${visits?`<span class="tag">${visits} مرة الشهر ده</span>`:""}</div>
      ${c.note?`<div class="meta">${esc(c.note)}</div>`:""}
      ${wdays.length?`<div class="weekdots">${WEEK_ORDER.map(w=>`<i class="${wdays.includes(w)?"on":""}">${DSHORT[w]}</i>`).join("")}</div>`:""}
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        ${href?`<a class="pill" href="${esc(href)}" target="_blank" rel="noopener">${ICON.map} الخريطة</a>`:`<span class="muted small">مفيش لوكيشن</span>`}
        ${c.phone?`<a class="pill" href="tel:${esc(c.phone.replace(/[^\d+]/g,""))}">${ICON.call} <span class="num" dir="ltr">${esc(c.phone)}</span></a>`:""}
        <button class="pill" data-edit="${c.id}" style="margin-inline-start:auto">تعديل</button>
      </div></div>`}).join("");
  $("#main").innerHTML=h;
  $("#addC").onclick=()=>centerSheet();$("#addC2")&&($("#addC2").onclick=()=>centerSheet());
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>centerSheet(b.dataset.edit));
}

/* ================= render: money ================= */
function renderMoney(){
  const t=today();let a,b,label,bars=[];
  if(period==="day"){a=b=t;label="النهارده"}
  else if(period==="week"){a=weekStart(t);b=addDays(a,6);label="الأسبوع ده · من السبت"}
  else{a=t.slice(0,7)+"-01";b=t.slice(0,7)+"-31";label=MONTHS[+t.slice(5,7)-1]}
  const T=totals(daysIn(a,b));
  if(period!=="day"){let x=a;const end=period==="week"?b:ymd(new Date(+t.slice(0,4),+t.slice(5,7),0));while(x<=end){const d=getDay(x);bars.push(d?wageOf(d)-fareSum(d):0);x=addDays(x,1)}}
  const mx=Math.max(1,...bars.map(Math.abs));
  let h=`<div class="periods" role="group" aria-label="الفترة">${[["day","اليوم"],["week","الأسبوع"],["month","الشهر"]].map(([k,l])=>`<button data-p="${k}" aria-pressed="${period===k}">${l}</button>`).join("")}</div>
  <div class="card"><div class="big"><span class="lbl">الصافي · ${label}</span><span class="v">${fmt(T.net)} <small>ج.م</small></span></div>
  ${bars.length?`<div class="bars" aria-hidden="true">${bars.map(v=>`<i class="${v<=0?"zero":""}" style="height:${Math.max(3,Math.abs(v)/mx*100)}%"></i>`).join("")}</div>`:""}
  <div class="split"><div><span>أيام شغل</span><b>${T.days}</b></div><div><span>الدخل</span><b>${fmt(T.w)}</b></div><div class="f"><span>المواصلات</span><b>${fmt(T.f)}</b></div></div></div>`;
  /* month browser */
  const [y,m]=month.split("-").map(Number);
  const list=daysIn(month+"-01",month+"-31").sort((p,q)=>q.date.localeCompare(p.date));
  const MT=totals(list);
  h+=`<div class="sec-h"><h2>كشف الشهر</h2></div><div class="card">
  <div class="mnav"><button class="iconbtn" id="mPrev" aria-label="الشهر اللي فات">${ICON.prev}</button><h3>${MONTHS[m-1]} ${y}</h3><button class="iconbtn" id="mNext" aria-label="الشهر الجاي">${ICON.next}</button></div>
  <div class="split" style="border-top:0;margin-top:4px"><div><span>الدخل</span><b>${fmt(MT.w)}</b></div><div class="f"><span>المواصلات</span><b>${fmt(MT.f)}</b></div><div><span>الصافي</span><b style="color:var(--money)">${fmt(MT.net)}</b></div></div>
  <div style="margin-top:6px">${list.length?list.map(d=>{const dt=parse(d.date);const names=[...new Set(d.items.filter(i=>i.status!=="off").map(i=>center(i.centerId)?.name).filter(Boolean))].join("، ")||(d.worked===false?"مش محسوب":"من غير سناتر");
    return`<button class="drow" data-date="${d.date}"><span class="d"><b>${dt.getDate()}</b><span>${DSHORT[dt.getDay()]}</span></span><span class="c">${esc(names)}</span><span class="m"><b>${fmt(wageOf(d)-fareSum(d))}</b><span>مواصلات ${fmt(fareSum(d))}</span></span></button>`}).join(""):`<div class="empty"><span>مفيش أيام متسجلة في الشهر ده.</span></div>`}</div></div>`;
  const counts={};list.forEach(d=>d.items.forEach(i=>{if(i.status!=="off")counts[i.centerId]=(counts[i.centerId]||0)+1}));
  const rows=Object.entries(counts).sort((p,q)=>q[1]-p[1]);
  if(rows.length)h+=`<div class="sec-h"><h2>الزيارات لكل سنتر</h2></div><div class="card">${rows.map(([id,n])=>`<div class="crow"><span>${esc(center(id)?.name||"سنتر اتمسح")}</span><b class="num">${n}</b></div>`).join("")}</div>`;
  $("#main").innerHTML=h;
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{period=b.dataset.p;render()});
  $("#mPrev").onclick=()=>{month=ymd(new Date(y,m-2,1)).slice(0,7);render()};
  $("#mNext").onclick=()=>{month=ymd(new Date(y,m,1)).slice(0,7);render()};
  document.querySelectorAll(".drow").forEach(b=>b.onclick=()=>{cur=b.dataset.date;go("today")});
}

/* ================= render: settings ================= */
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(view==="settings"||view==="today")render()});
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone;
function renderSettings(){
  let h="";
  if(!standalone())h+=`<div class="install"><p>${deferredInstall?"نزّل مشواري على الموبايل وافتحه من أيقونته":"علشان تنزله: من قايمة كروم (⋮) اختار «تثبيت التطبيق» أو «إضافة للشاشة الرئيسية»"}</p>${deferredInstall?`<button class="btn ink" id="inst">تثبيت</button>`:""}</div>`;
  h+=`<div class="sec-h"><h2>التفعيلات</h2></div><div id="pushBox"><div class="card"><span class="muted small">بنتحقق من حالة الإشعارات...</span></div></div>`;
  h+=`<div class="sec-h"><h2>اليومية</h2></div><div class="card stack">
    <label class="field">قيمة اليومية (ج.م)<input type="number" inputmode="decimal" id="rate" class="num" value="${S.rate}"></label>
    <span class="muted small">التغيير بيسري على الأيام الجديدة بس. الأيام اللي فاتت بتفضل بيوميتها.</span>
    <button class="btn ink" id="saveRate">احفظ اليومية</button></div>
  <div class="sec-h"><h2>الجدول الأسبوعي</h2></div><div class="card">${WEEK_ORDER.some(w=>(S.weekly[w]||[]).length)?WEEK_ORDER.filter(w=>(S.weekly[w]||[]).length).map(w=>`<div class="crow"><b>${DAYS[w]}</b><span class="muted small" style="text-align:left">${S.weekly[w].map(t=>esc(center(t.centerId)?.name||"")+" "+tStr(t.start)).join("، ")}</span></div>`).join(""):`<span class="muted small">لما تعلّم على «كرر الميعاد ده» وانت بتضيف ميعاد، هيظهر هنا ويتعرض عليك كل أسبوع في نفس اليوم.</span>`}</div>
  <div class="sec-h"><h2>نسخة احتياطية</h2></div><div class="card stack">
    <span class="muted small">بياناتك محفوظة على الموبايل ده بس. خد نسخة كل فترة وابعتها لنفسك على واتساب أو الإيميل، علشان لو غيرت الموبايل.</span>
    <div class="row"><button class="btn ink" id="exp">حفظ نسخة</button><button class="btn ghost" id="impBtn">استرجاع نسخة</button></div>
    <input type="file" id="imp" accept="application/json,.json" hidden>
    <div id="impConfirm" class="confirm" hidden><span id="impMsg"></span><div><button class="btn danger" id="impYes">استرجع</button><button class="btn ghost" id="impNo">لا</button></div></div>
  </div>
  <p class="muted small" style="text-align:center">مشواري · ${Object.keys(S.days).length} يوم · ${S.centers.length} سنتر</p>`;
  $("#main").innerHTML=h;
  refreshPushBox();
  $("#inst")&&($("#inst").onclick=async()=>{deferredInstall.prompt();await deferredInstall.userChoice.catch(()=>{});deferredInstall=null;render()});
  $("#saveRate").onclick=()=>{const r=+$("#rate").value;if(!(r>=0)){toast("اكتب رقم صحيح");return}
    const old=S.rate;S.rate=r;const td=getDay(today());if(td&&td.wage===old&&!td.touched)td.wage=r;save();render();toast("اليومية بقت "+fmt(r)+" ج.م")};
  $("#exp").onclick=async()=>{
    const name="mishwari-backup-"+today()+".json";const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"نسخة مشواري"});return}catch(e){if(e.name==="AbortError")return}}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("اتحفظت النسخة في التنزيلات");
  };
  let pending=null;
  $("#impBtn").onclick=()=>$("#imp").click();
  $("#imp").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.centers)||typeof d.days!=="object")throw 0;pending=d;
    $("#impMsg").textContent=`النسخة فيها ${d.centers.length} سنتر و${Object.keys(d.days).length} يوم. هتحل مكان البيانات اللي على الموبايل دلوقتي.`;$("#impConfirm").hidden=false}catch(x){toast("الملف ده مش نسخة من مشواري")}};r.readAsText(f);e.target.value=""};
  $("#impNo").onclick=()=>{pending=null;$("#impConfirm").hidden=true};
  $("#impYes").onclick=()=>{S=Object.assign({},DEF,pending);save();render();toast("اتسترجعت النسخة")};
}

/* ================= router ================= */
function go(v){view=v;if(v==="today"&&!$("#sheet").hidden)closeSheet();render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll(".nav button").forEach(b=>b.dataset.v===view?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  $("#fab").hidden=view!=="today"&&view!=="centers";
  $("#fab").setAttribute("aria-label",view==="centers"?"ضيف سنتر جديد":"ضيف ميعاد لجدول اليوم");
  renderTop();
  ({today:renderToday,centers:renderCenters,money:renderMoney,settings:renderSettings})[view]();
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{if(b.dataset.v==="today"&&view==="today")cur=today();go(b.dataset.v)});
$("#fab").onclick=()=>view==="centers"?centerSheet():slotSheet();
/* refresh the "now" highlight and roll over to a new day */
let lastDay=today();setInterval(()=>{if(today()!==lastDay){if(cur===lastDay)cur=today();lastDay=today()}if(view==="today"&&$("#sheet").hidden&&document.activeElement.tagName!=="TEXTAREA"&&document.activeElement.tagName!=="INPUT")render()},60000);
render();

if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("message",e=>{
    if(e.data&&e.data.type==="notification-click"){cur=today();go("today")}
  });
}
</script>
</body>
</html>
