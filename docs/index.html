<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مشواري</title>
<meta name="theme-color" content="#16202C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Shell: ink header band with the day's money, scrolling cards, fixed bottom nav (5 tabs); every form is a bottom sheet */
:root{
  --ink:#16202C; --ink-2:#22303F; --on-ink:#F2F5F8; --on-ink-2:#9FB0C2;
  --bg:#E9EDF1; --card:#FFFFFF; --line:#DCE2E8; --fg:#16202C; --muted:#64748A;
  --sun:#FFC23D; --sun-ink:#2A1F00;
  --money:#0F7B57; --money-soft:#DDF1E8; --fare:#C2410C; --fare-soft:#FCE9DE;
  --tab:#5B5BD6; --tab-soft:#E6E6FB;
  --warn:#9A6700; --off:#8A96A3; --danger:#B42318;
  --head:"Cairo","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Cairo",Tahoma,"Segoe UI",sans-serif;
  --r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --ink:#0B1118; --ink-2:#17212C; --on-ink:#EEF2F6; --on-ink-2:#8EA0B3;
  --bg:#0F151C; --card:#18212B; --line:#26313D; --fg:#E7ECF1; --muted:#93A3B4;
  --money:#46C996; --money-soft:#123327; --fare:#F08A55; --fare-soft:#3A2116;
  --tab:#9C9CF5; --tab-soft:#24244A;
  --warn:#E8B44A; --off:#6B7785; --danger:#F28B82; color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;overscroll-behavior-y:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--fg)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* header */
.top{background:var(--ink);color:var(--on-ink);padding:calc(env(safe-area-inset-top,0px) + 14px) max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));border-radius:0 0 26px 26px;position:relative}
.top .brand{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--on-ink-2)}
.top .brand b{font-family:var(--head);font-weight:800;color:var(--sun);font-size:1rem;letter-spacing:.01em}
.top h1{font-family:var(--head);font-weight:800;font-size:1.65rem;margin:6px 0 0;line-height:1.25}
.top .sub{color:var(--on-ink-2);font-size:.85rem}
.datebar{display:flex;align-items:center;gap:8px;margin-top:4px}
.datebar .t{flex:1;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--ink-2);color:var(--on-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.strip>div,.strip>button{background:var(--ink-2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;border:0;text-align:right;color:var(--on-ink)}
.strip span{font-size:.72rem;color:var(--on-ink-2)}
.strip b{font-family:var(--head);font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.strip .in b{color:#7FE0B5}
.strip .out b{color:#FFB08A}
.strip .net b{color:var(--sun)}
.strip button{cursor:pointer}

/* main */
main{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(160px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 2px -4px;flex-wrap:wrap}
.sec-h h2{font-family:var(--head);font-weight:700;font-size:1.05rem;margin:0}
.sec-h .links{display:flex;gap:4px}
.link{border:0;background:none;color:var(--money);font-weight:600;cursor:pointer;padding:6px 4px}
.card{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;cursor:pointer;font-size:.8rem;line-height:1.3;text-align:center}
.quick .q-fare .ico{background:var(--sun);color:var(--sun-ink)}
.quick .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.quick .ico svg{width:20px;height:20px}
.quick .q-out .ico{background:var(--fare-soft);color:var(--fare)}
.quick .q-in .ico{background:var(--money-soft);color:var(--money)}
.quick .q-tab .ico{background:var(--tab-soft);color:var(--tab)}

/* ledger */
.ledger{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:10px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;width:100%;text-align:right;cursor:pointer}
.lrow:last-child{border-bottom:0}
.lrow .dot{width:10px;height:10px;border-radius:50%}
.lrow .tx{min-width:0;display:flex;flex-direction:column;line-height:1.35}
.lrow .tx b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .tx span{font-size:.76rem;color:var(--muted)}
.lrow .amt{font-family:var(--head);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--money)} .amt.out{color:var(--fare)} .amt.tab{color:var(--tab)} .amt.adj{color:var(--warn)} .amt.move{color:var(--muted)} .amt.pay{color:var(--money)} .amt.open{color:var(--muted)}
.pockets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;border-inline-start:4px solid var(--c);font:inherit;color:var(--fg);text-align:start;cursor:pointer}
.pk span{font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk b{font-family:var(--head);font-size:1.15rem;font-variant-numeric:tabular-nums}
.pk b.neg{color:var(--fare)}
.lrow .x{visibility:hidden}
.lrow.del .x{visibility:visible}

/* schedule timeline */
.slots{display:flex;flex-direction:column;gap:10px}
.slot{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:right;width:100%}
.slot .time{display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:2px dashed var(--line);padding-left:10px;font-variant-numeric:tabular-nums}
.slot .time b{font-family:var(--head);font-size:1.15rem;font-weight:700;line-height:1.1}
.slot .time span{font-size:.72rem;color:var(--muted)}
.slot .info{min-width:0;display:flex;flex-direction:column;gap:6px}
.slot .name{font-weight:600;font-size:1rem;display:flex;gap:8px;align-items:center;justify-content:space-between}
.slot .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.slot .meta{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .acts{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--fg)}
.st{font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px;flex:none}
.st.wait{background:var(--bg);color:var(--muted)}
.st.done{background:var(--money-soft);color:var(--money)}
.st.off{background:var(--fare-soft);color:var(--fare)}
.slot.is-off{opacity:.6}
.slot.is-off .name span{text-decoration:line-through}
.slot.now{border-color:var(--sun);box-shadow:0 0 0 2px color-mix(in srgb,var(--sun) 35%,transparent)}
.rep{font-size:.7rem;color:var(--muted)}

.empty{text-align:center;padding:22px 12px;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-family:var(--head);font-size:1rem}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--bg);color:var(--fg)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ink{background:var(--ink);color:var(--on-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:.85rem}
.btn:focus-visible,.pill:focus-visible,.iconbtn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-visible,.lrow:focus-visible{outline:2px solid var(--sun);outline-offset:2px}

.x{border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer;width:32px;height:32px;border-radius:10px}
.daytoggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--money)}
.switch input:checked+span::after{right:23px}
textarea.note{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:60px;resize:vertical}

/* banners */
.due{display:flex;align-items:center;gap:10px;background:var(--tab-soft);color:var(--fg);border-radius:var(--r);padding:10px 12px}
.due p{margin:0;flex:1;font-size:.88rem;min-width:0}
.due b{color:var(--tab)}

/* centers */
.center{display:flex;flex-direction:column;gap:8px}
.center .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.center .h b{font-size:1.02rem}
.center .meta{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.tag{font-size:.72rem;font-weight:700;background:var(--money-soft);color:var(--money);border-radius:999px;padding:2px 8px;flex:none}
.weekdots{display:flex;gap:4px;flex-wrap:wrap}
.weekdots i{font-style:normal;font-size:.72rem;padding:1px 7px;border-radius:6px;background:var(--bg);color:var(--muted)}
.weekdots i.on{background:var(--ink);color:var(--on-ink)}

/* cafe */
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:center;text-align:center;background:var(--bg);border-radius:12px;padding:10px 6px}
.eq div{display:flex;flex-direction:column;min-width:0}
.eq span{font-size:.7rem;color:var(--muted)}
.eq b{font-family:var(--head);font-variant-numeric:tabular-nums;font-size:1.05rem}
.eq i{font-style:normal;color:var(--muted);font-weight:700}

/* reports */
.periods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.periods button{border:0;background:transparent;border-radius:10px;padding:9px 4px;font-weight:600;color:var(--muted);cursor:pointer}
.periods button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.big{display:flex;flex-direction:column;gap:2px}
.big .lbl{font-size:.8rem;color:var(--muted)}
.big .v{font-family:var(--head);font-weight:800;font-size:2.2rem;color:var(--money);line-height:1.2;font-variant-numeric:tabular-nums}
.big .v.neg{color:var(--fare)}
.big .v small{font-size:.9rem;font-weight:600;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.split div{display:flex;flex-direction:column;min-width:0}
.split span{font-size:.74rem;color:var(--muted)}
.split b{font-family:var(--head);font-weight:700;font-variant-numeric:tabular-nums}
.split .f b{color:var(--fare)} .split .g b{color:var(--money)}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:12px}
.bars i{flex:1;background:var(--fare);border-radius:3px 3px 0 0;min-height:2px;opacity:.8}
.bars i.zero{background:var(--line)}
.bars i.today{opacity:1;background:var(--sun)}
.mnav{display:flex;align-items:center;gap:8px}
.mnav h3{flex:1;text-align:center;margin:0;font-family:var(--head);font-size:1rem}
.mnav .iconbtn{background:var(--bg);color:var(--fg)}
.catrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem}
.catrow .nm i{width:10px;height:10px;border-radius:50%;flex:none}
.catrow .v{font-family:var(--head);font-weight:700;font-variant-numeric:tabular-nums;text-align:left}
.catrow .bar{grid-column:1/-1;height:6px;background:var(--bg);border-radius:6px;overflow:hidden}
.catrow .bar s{display:block;height:100%;border-radius:6px}
.top1{display:flex;gap:12px;align-items:center}
.top1 .ring{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:.95rem}
.top1 p{margin:0;font-size:.9rem}
.drow{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-top:0;width:100%;text-align:right}
.drow:last-child{border-bottom:0}
.drow .d{display:flex;flex-direction:column;align-items:center;background:var(--bg);border-radius:10px;padding:3px 0}
.drow .d b{font-family:var(--head);font-size:1.05rem;line-height:1.2}
.drow .d span{font-size:.66rem;color:var(--muted)}
.drow .c{min-width:0;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .m{text-align:left;font-variant-numeric:tabular-nums;font-size:.85rem;line-height:1.3}
.drow .m b{color:var(--money);font-family:var(--head)}
.drow .m span{display:block;color:var(--fare);font-size:.74rem}
.crow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.crow:last-child{border-bottom:0}
.crow b{font-variant-numeric:tabular-nums}

/* settings */
.field{display:flex;flex-direction:column;gap:6px;font-size:.84rem;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%;font-size:1rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}

/* bottom nav */
.nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));z-index:20}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:.7rem;font-weight:600;cursor:pointer;border-radius:12px;min-width:0}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] .ic{background:var(--sun);color:var(--sun-ink)}
.nav .ic{width:48px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.fab{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(22,32,44,.28);cursor:pointer;z-index:19}
.fab svg{width:28px;height:28px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,22,.5);z-index:40;opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{position:fixed;inset:auto 0 0 0;background:var(--card);border-radius:24px 24px 0 0;z-index:41;max-height:92%;overflow:auto;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .25s ease;max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sheet h3{font-family:var(--head);font-size:1.2rem;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 4px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"].wait{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.seg button[aria-pressed="true"].done,.seg button[aria-pressed="true"].in{background:var(--money);color:#fff;border-color:var(--money)}
.seg button[aria-pressed="true"].off,.seg button[aria-pressed="true"].out{background:var(--fare);color:#fff;border-color:var(--fare)}
.seg button[aria-pressed="true"].tab{background:var(--tab);color:#fff;border-color:var(--tab)}
.bigamt{font-family:var(--head);font-size:2rem!important;font-weight:800;text-align:center;padding:10px!important}
.check{display:flex;align-items:center;gap:10px;font-size:.92rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--money)}
.sheet .foot{display:flex;gap:8px;margin-top:16px}
.sheet .foot .btn{flex:1}
.confirm{background:var(--fare-soft);color:var(--fare);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.confirm div{display:flex;gap:8px}
.hint{font-size:.8rem;color:var(--muted);margin:-4px 0 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:10px 18px;border-radius:12px;font-weight:600;z-index:60;font-size:.9rem;max-width:calc(100% - 32px);text-align:center}
.install{background:var(--sun);color:var(--sun-ink);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px}
.install p{margin:0;flex:1;font-size:.88rem;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top" id="top"></header>
<main id="main"></main>

<button class="fab" id="fab" aria-label="سجل مصروف"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="nav" id="nav">
  <button data-v="today" aria-current="page"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></svg></span>النهارده</button>
  <button data-v="cafe"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6V9z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3"/></svg></span>الكافتيريا</button>

<script>
"use strict";
/* ================= storage ================= */
const KEY="mishwari:v1";
const DEF={rate:150,fareCap:30,centers:[],days:{},weekly:{},tx:[],cafe:{shifts:{},tabs:[],pays:[]},subs:[],subSkip:{},notes:{},wallet:null};
const DEF_POCKETS=[
  {id:"centers",name:"فلوس السناتر",color:"#0F7B57",fixed:true},
  {id:"cafe",name:"مرتب الكافتيريا",color:"#B7791F",fixed:true},
  {id:"other",name:"فلوس تانية",color:"#2F7DD1",fixed:true}
];
const POCKET_COLORS=["#8B5CF6","#D0457F","#0E9AA0","#E0524A","#9A7B4F","#64748A"];
let S;
function loadState(raw){
  const s=Object.assign({},DEF,raw||{});
  s.cafe=Object.assign({shifts:{},tabs:[],pays:[]},s.cafe||{});
  ["tx","subs","centers"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});
  ["days","weekly","subSkip","notes"].forEach(k=>{if(!s[k]||typeof s[k]!=="object")s[k]={}});
  /* جيوب الفلوس: كل جنيه داخل بيروح لجيب، وكل صرف بيطلع من جيب */
  if(!Array.isArray(s.pockets)||!s.pockets.length)s.pockets=DEF_POCKETS.map(p=>({...p}));
  DEF_POCKETS.forEach(p=>{if(!s.pockets.some(x=>x.id===p.id))s.pockets.push({...p})});
  /* ترحيل: ملاحظة اليوم كانت جوه days، دلوقتي في notes علشان كتابة ملاحظة ما تحسبش يومية */
  Object.values(s.days).forEach(d=>{if(d.note){if(!s.notes[d.date])s.notes[d.date]=d.note;delete d.note}});
  if(!Array.isArray(s.cpays))s.cpays=[];
  /* ترحيل: اليومية كانت بتدخل الجيب كل يوم، فلما حددت رصيدك اتخصم منه يومية النهارده. دلوقتي اليومية بتدخل الجيب بس لما تقبض آخر الأسبوع */
  if(!s.migWeekly){
    if(s.wallet){const n=new Date(),t=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");s.wallet.base+=Object.values(s.days).filter(d=>d.date>=s.wallet.since&&d.date<=t&&d.worked!==false).reduce((a,d)=>a+(+d.wage||0),0)}
    s.migWeekly=1;
  }
  return s;
}
try{S=loadState(JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){try{const r=localStorage.getItem(KEY);if(r&&!localStorage.getItem(KEY+":rescue"))localStorage.setItem(KEY+":rescue",r)}catch(_){}S=loadState({})}
var syncReady=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("المساحة مليانة، الحفظ ما نجحش")}if(syncReady)scheduleSync()}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const DAYS=["الأحد","الاتنين","التلات","الأربع","الخميس","الجمعة","السبت"];
const DSHORT=["أحد","اتنين","تلات","أربع","خميس","جمعة","سبت"];
const WEEK_ORDER=[6,0,1,2,3,4,5];
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{n=Math.round((+n||0)*100)/100;return n.toLocaleString("en-US")};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(ym,n)=>{const[y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+n,1);return ymd(d).slice(0,7)};
const monthName=ym=>{const[y,m]=ym.split("-").map(Number);return MONTHS[m-1]+" "+y};
const lastDay=ym=>{const[y,m]=ym.split("-").map(Number);return ymd(new Date(y,m,0))};
const weekStart=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+1)%7));return ymd(d)};
function t12(hm){if(!hm)return{h:"--",p:""};let[h,m]=hm.split(":").map(Number);const p=h<12?"ص":"م";h=h%12||12;return{h:h+":"+String(m).padStart(2,"0"),p}}
const tStr=hm=>{const x=t12(hm);return x.h+" "+x.p};
const shortDate=s=>{const d=parse(s);return DSHORT[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]};
const center=id=>S.centers.find(c=>c.id===id);
function mapHref(loc){if(!loc)return"";loc=loc.trim();return/^https?:\/\//i.test(loc)?loc:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(loc)}
const fareSum=d=>(d?.transport||[]).reduce((a,t)=>a+(+t.amount||0),0);
const wageOf=d=>d&&d.worked!==false?(+d.wage||0):0;
/* مواصلات السناتر: لو مجموع اليوم عدّى الحد (30)، الفرق على صاحب الشغل */
const fareCap=()=>S.fareCap!=null?+S.fareCap:30;
const fareOwed=d=>Math.max(0,fareSum(d)-fareCap());
const refundOf=d=>+(d?.refund?.amount)||0;
const refundDue=d=>Math.max(0,fareOwed(d)-refundOf(d));
const pendingRefunds=()=>Object.values(S.days).filter(d=>refundDue(d)>0).sort((a,b)=>a.date.localeCompare(b.date));
/* يومية السناتر بتتحسب كل يوم، بس الفلوس بتيجي مرة واحدة بعد الأسبوع ما يخلص */
const cpayOf=d=>d&&d.paidBy?S.cpays.find(p=>p.id===d.paidBy):null;
const unpaidDays=()=>Object.values(S.days).filter(d=>wageOf(d)>0&&!cpayOf(d)&&d.date<=today()).sort((a,b)=>a.date.localeCompare(b.date));
function markRefund(date){const d=S.days[date];if(!d)return 0;const due=refundDue(d);if(due>0)d.refund={amount:refundOf(d)+due,date:today()};return due}
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
const ICON={
  map:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg>',
  call:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  in:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  bus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 10h16M7 21v-2M17 21v-2"/><circle cx="8" cy="14" r="1" fill="currentColor"/><circle cx="16" cy="14" r="1" fill="currentColor"/></svg>',
  tab:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>'
};

/* ================= الفئات ================= */
const OUT_CATS=[
  ["food","أكل وشرب","#E39A2D"],["transport","مواصلات","#C2410C"],["outing","خروجات","#8B5CF6"],
  ["subs","اشتراكات","#2F7DD1"],["bills","فواتير ورصيد","#0E9AA0"],["clothes","لبس","#D0457F"],
  ["health","صحة وصيدلية","#2E9E5B"],["home","البيت","#9A7B4F"],["gifts","هدايا","#E0524A"],["other","تانية","#7A8794"]
];
const IN_CATS=[["extra","شغل إضافي","#0F7B57"],["gift","هدية / عيدية","#2E9E5B"],["back","حد رجّعلي فلوس","#0E9AA0"],["other_in","تانية","#7A8794"]];
const AUTO_CATS={centers:["السناتر","#0F7B57"],cfare:["مواصلات السناتر","#E4572E"],refund:["مواصلات من صاحب الشغل","#0E9AA0"],cafe:["مرتب الكافتيريا","#16A34A"],adj:["فرق مش معروف","#9A6700"],cpay:["قبض السناتر","#0F7B57"],open:["ظبط رصيد","#2F7DD1"],move:["تحويل بين الجيوب","#7A8794"],tab:["أجل الكافتيريا","#5B5BD6"]};
function catInfo(id){
  const f=OUT_CATS.find(c=>c[0]===id)||IN_CATS.find(c=>c[0]===id);
  if(f)return{name:f[1],color:f[2]};
  if(AUTO_CATS[id])return{name:AUTO_CATS[id][0],color:AUTO_CATS[id][1]};
  return{name:"تانية",color:"#7A8794"};
}

/* ================= حركة الفلوس: كل مصدر في قايمة واحدة =================
   k: in (دخل كاش) · out (صرف كاش) · adj (فرق لما تعدّ فلوسك) · tab (أجل: مش كاش، بيتخصم من المرتب) */
function events(a,b){
  const out=[];
  for(const d of Object.values(S.days)){
    if(d.date<a||d.date>b)continue;
    const w=wageOf(d);
    if(w>0)out.push({date:d.date,k:"in",cash:0,amount:w,cat:"centers",label:"يومية السناتر",src:"wage",paid:!!cpayOf(d)});
    for(const t of d.transport||[])out.push({date:d.date,k:"out",cash:-(+t.amount||0),amount:+t.amount||0,cat:"cfare",label:t.note||"مواصلات السناتر",src:"fare",ref:t.id,ts:t.ts,pocket:t.pocket||"centers"});
  }
  for(const d of Object.values(S.days)){
    if(!d.refund||!refundOf(d))continue;const rd=d.refund.date||d.date;if(rd<a||rd>b)continue;
    const vp=d.refund.viaPay&&S.cpays.some(p=>p.id===d.refund.viaPay);
    out.push({date:rd,k:"in",cash:vp?0:refundOf(d),amount:refundOf(d),cat:"refund",label:"صاحب الشغل رجّعلي مواصلات "+shortDate(d.date),src:"refund",ref:d.date,pocket:vp?undefined:"centers",viaPay:vp});
  }
  for(const p of S.cpays){if(p.date<a||p.date>b)continue;out.push({date:p.date,k:"pay",cash:p.old?0:+p.amount||0,amount:+p.amount||0,cat:"cpay",label:"قبض السناتر · "+p.days.length+" يوم"+(p.old?" (قبل ما أسجل جيبي)":""),src:"cpay",ref:p.id,ts:p.ts,pocket:p.old?undefined:"centers"})}
  for(const t of S.tx){
    if(t.date<a||t.date>b)continue;
    const amt=+t.amount||0;
    const pk=t.pocket||"other";
    if(t.type==="in")out.push({date:t.date,k:"in",cash:amt,amount:amt,cat:t.cat,label:t.note||catInfo(t.cat).name,src:"tx",ref:t.id,ts:t.ts,pocket:pk});
    else if(t.type==="adj")out.push({date:t.date,k:"adj",cash:amt,amount:amt,cat:"adj",label:amt<0?"فلوس ناقصة مش عارف راحت فين":"فلوس زيادة مش متسجلة",src:"tx",ref:t.id,ts:t.ts,pocket:pk});
    else if(t.type==="open")out.push({date:t.date,k:"open",cash:amt,amount:amt,cat:"open",label:"ظبطت رصيد "+pocketOf(pk).name,src:"tx",ref:t.id,ts:t.ts,pocket:pk});
    else if(t.type==="move")out.push({date:t.date,k:"move",cash:0,amount:amt,cat:"move",label:"حوّلت من "+pocketOf(t.from).name+" لـ "+pocketOf(t.to).name,src:"tx",ref:t.id,ts:t.ts,from:t.from,to:t.to});
    else out.push({date:t.date,k:"out",cash:-amt,amount:amt,cat:t.cat,label:t.note||catInfo(t.cat).name,src:"tx",ref:t.id,ts:t.ts,pocket:pk});
  }
  for(const p of S.cafe.pays){if(p.date<a||p.date>b)continue;out.push({date:p.date,k:"in",cash:+p.received||0,amount:+p.received||0,cat:"cafe",label:"قبض الكافتيريا · "+monthName(p.month),src:"pay",ref:p.id,pocket:"cafe"})}
  for(const t of S.cafe.tabs){if(t.date<a||t.date>b)continue;out.push({date:t.date,k:"tab",cash:0,amount:+t.amount||0,cat:"tab",label:t.note||"أجل من الكافتيريا",src:"tab",ref:t.id,ts:t.ts})}
  return out;
}
function sums(ev){
  let inc=0,spend=0,adj=0,tab=0;
  for(const e of ev){if(e.k==="in")inc+=e.amount;else if(e.k==="out")spend+=e.amount;else if(e.k==="adj")adj+=e.amount;else if(e.k==="tab")tab+=e.amount}
  return{inc,spend,adj,tab,net:inc-spend+adj};
}
/* الرصيد اللي في جيبك: base + كل الحركة من يوم ما حددته */
function walletBalance(){
  if(!S.wallet)return null;
  return S.wallet.base+events(S.wallet.since,"9999-12-31").reduce((a,e)=>a+e.cash,0);
}
function setWallet(actual,pocket){
  const since=today();
  const moved=events(since,"9999-12-31").reduce((a,e)=>a+e.cash,0);
  S.wallet={since,base:actual-moved,at:Date.now(),pocket:pocket||"other"};
}
/* ================= الجيوب ================= */
const pocketOf=id=>S.pockets.find(p=>p.id===id)||{id,name:"فلوس اتمسحت",color:"#7A8794"};
/* رصيد كل جيب: نفس حسبة «في جيبك» بس متقسمة. بداية الرصيد بتتحط في الجيب اللي اخترته */
function pocketBalances(){
  const bal={};S.pockets.forEach(p=>bal[p.id]=0);
  const since=S.wallet?S.wallet.since:"0000-01-01";
  if(S.wallet){const p=S.wallet.pocket||"other";bal[p]=(bal[p]||0)+S.wallet.base}
  for(const e of events(since,"9999-12-31")){
    if(e.k==="move"){bal[e.from]=(bal[e.from]||0)-e.amount;bal[e.to]=(bal[e.to]||0)+e.amount}
    else if(e.pocket)bal[e.pocket]=(bal[e.pocket]||0)+e.cash;
  }
  return bal;
}
function pocketChips(sel,bal,id){
  return`<div class="chips" id="${id}">${S.pockets.map(p=>`<button type="button" class="chip" data-pk="${p.id}" aria-pressed="${p.id===sel}"><i style="background:${p.color}"></i>${esc(p.name)}<span class="num" style="opacity:.7;font-weight:500">${fmt(bal[p.id]||0)}</span></button>`).join("")}</div>`;
}
function bindPocketChips(id,set){$$("#"+id+" .chip").forEach(b=>b.onclick=()=>{set(b.dataset.pk);$$("#"+id+" .chip").forEach(x=>x.setAttribute("aria-pressed",x===b))})}

/* ================= الاشتراكات ================= */
function dueSubs(){
  const t=today(),ym=t.slice(0,7),day=+t.slice(8,10);
  return S.subs.filter(s=>s.active!==false&&day>=Math.min(+s.day||1,+lastDay(ym).slice(8,10))&&!S.subSkip[s.id+":"+ym]&&!S.tx.some(x=>x.subId===s.id&&x.subMonth===ym));
}
/* ================= Web Push + المزامنة ================= */
const VAPID_PUBLIC="BFfZJep0Ysf6-mytm5H87B_CZar5yNIkf8LJwSDCrut2W54eoa6SkaRu7MkrawC4UJj9L1OfLUcELEq_jxpXDHs";
const NTFY_BASE="https://ntfy.sh/";
const urlB64ToU8A=b64=>{const p=b64.replace(/-/g,"+").replace(/_/g,"/");const raw=atob(p+"=".repeat((4-p.length%4)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0))};
/* ArrayBuffer -> base64url (ده اللي كان ناقص: getKey بترجع ArrayBuffer و JSON.stringify بيحوّلها {}) */
const b64u=buf=>{if(!buf||!buf.byteLength)return"";const a=new Uint8Array(buf);let s="";for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const subKeys=sub=>({p256dh:b64u(sub.getKey("p256dh")),auth:b64u(sub.getKey("auth"))});
const newTopic=()=>"mishwari-"+Array.from(crypto.getRandomValues(new Uint8Array(9))).map(x=>x.toString(16).padStart(2,"0")).join("");
/* ترقيّة: لو الاشتراك موجود بس المفاتيح مش متسجّلة (نسخة قديمة)، نرمّمها من الاشتراك الحي */
async function ensureSubKeys(){
  try{
    const regs=await navigator.serviceWorker.getRegistrations();if(!regs.length)return;
    const s=await regs[0].pushManager.getSubscription();if(!s)return;
    const k=subKeys(s);if(!k.p256dh||!k.auth)return;
    if(!S.notif||S.notif.endpoint!==s.endpoint||!S.notif.p256dh||!S.notif.auth){
      S.notif=Object.assign({},S.notif,{enabled:true,endpoint:s.endpoint,p256dh:k.p256dh,auth:k.auth});
      if(!S.notif.topic)S.notif.topic=newTopic();
      save();
    }
  }catch(e){}
}

async function pushState(){
  const out={supported:"Notification" in window&&"PushManager" in window,perm:"denied",sub:null,sw:false};
  if(!out.supported)return out;
  out.perm=Notification.permission;
  try{const regs=await navigator.serviceWorker.getRegistrations();out.sw=regs.length>0;if(out.sw&&out.perm==="granted"){const r=regs[0];out.sub=await r.pushManager.getSubscription()}}catch(e){}
  return out;
}
async function enablePush(){
  const perm=await Notification.requestPermission();
  if(perm!=="granted"){toast("محتاجين إذن الإشعارات من المتصفح");await refreshPushBox();return}
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToU8A(VAPID_PUBLIC)});
    const k=subKeys(sub);
    const topic=(S.notif&&S.notif.topic)||newTopic();
    S.notif=Object.assign({},S.notif,{enabled:true,endpoint:sub.endpoint,p256dh:k.p256dh,auth:k.auth,topic,at:Date.now()});

/* ---------- المزامنة: الموبايل بيبعت جدوله للسيرفر عن طريق ntfy ---------- */
function slotStamp(date,hm,offMin){
  const d=parse(date);const [h,m]=String(hm||"00:00").split(":").map(Number);
  d.setHours(h||0,m||0,0,0);d.setMinutes(d.getMinutes()+(offMin||0));return d.getTime();
}
function syncPayload(){
  const n=S.notif||{};const t=today();const appts=[];const transported={};
  for(let i=0;i<3;i++){
    const d=addDays(t,i);const day=S.days[d];if(!day)continue;
    for(const it of (day.items||[])){
      if(it.status==="off")continue;
      appts.push({
        id:it.id,date:d,start:it.start||"",end:it.end||"",
        center:(center(it.centerId)||{}).name||"سنتر",status:it.status||"wait",
        remindAt:n.before!==false?slotStamp(d,it.start,-60):0,
        transportAt:n.after!==false&&it.end?slotStamp(d,it.end,15):0
      });
    }
  }
  Object.keys(S.days).forEach(d=>{transported[d]=((S.days[d].transport||[]).length>0)});
  return {v:1,at:Date.now(),rate:S.rate,
    notif:{hour:n.hour!=null?n.hour:8,before:n.before!==false,after:n.after!==false},
    appts,transported,
    sub:(n.endpoint&&n.p256dh)?{endpoint:n.endpoint,keys:{p256dh:n.p256dh,auth:n.auth}}:null};
}
async function syncNow(manual){
  const n=S.notif||{};
  if(!n.enabled)return false;
  const body=JSON.stringify(syncPayload());
  const mark=(ok,msg)=>{
    S.notif=Object.assign({},S.notif,{syncedAt:Date.now(),syncOk:ok});
    lastSyncAt=Date.now();
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}   /* حفظ مباشر: مش save() عشان ما تعملش حلقة مزامنة لا نهائية */
    if(manual)toast(msg);
    return ok;
  };
  try{
    /* الأولوية لسيرفر الـ Worker (دايماً شغال) — لو مش متظبط نرجع لـ ntfy */
    if(n.syncUrl){
      const res=await fetch(n.syncUrl.replace(/\/+$/,"")+"/sync",{method:"POST",body,headers:{"Content-Type":"application/json","Authorization":"Bearer "+(n.syncToken||"")},keepalive:true});
      if(res.ok)return mark(true,"تمت المزامنة مع السيرفر ✅");
      if(manual)toast("السيرفر رجّع خطأ "+res.status);
      return mark(false);
    }
    if(n.topic){
      const res=await fetch(NTFY_BASE+n.topic,{method:"POST",body,headers:{"Content-Type":"text/plain; charset=utf-8"},keepalive:true});
      if(res.ok)return mark(true,"تمت المزامنة ✅");
      if(manual)toast("المزامنة رجعت خطأ "+res.status);
      return mark(false);
    }
  }catch(e){if(manual)toast("مفيش نت — المزامنة اتأجلت");return false}
  return false;
}
let syncT, lastSyncAt=0;
function scheduleSync(){
  clearTimeout(syncT);
  /* مزامنة واحدة كل دقيقة على الأكثر (ntfy المجاني محدود بعدد الطلبات) */
  const wait=lastSyncAt?Math.max(2500,60000-(Date.now()-lastSyncAt)):2500;
  syncT=setTimeout(()=>syncNow(false),wait);
}

  h+=`<div class="sec-h"><h2>السناتر</h2><div class="links"><button class="link" id="addSlot">+ ميعاد</button><button class="link" id="addFare" style="color:var(--fare)">+ مواصلات</button></div></div>`;
  if(!items.length){
    if(tpl.length)h+=`<div class="card empty"><b>عندك جدول ${DAYS[wd]} المعتاد</b><span>${tpl.map(t=>esc(center(t.centerId)?.name||"سنتر")+" "+tStr(t.start)).join(" · ")}</span><button class="btn sun" id="useTpl">حطه في جدول اليوم</button></div>`;
    else h+=`<div class="card empty" style="padding:14px"><span>${S.centers.length?"مفيش مواعيد سناتر لليوم ده.":"لسه ما ضفتش سناتر. ضيفها من تاب السناتر."}</span></div>`;
  }else{
    const nm=nowMinutes();
    h+='<div class="slots">'+items.map(it=>{
      const c=center(it.centerId)||{name:"سنتر اتمسح"};const s=t12(it.start);
      const now=isT&&(it.status||"wait")==="wait"&&mins(it.start)<=nm&&nm<(it.end?mins(it.end):mins(it.start)+120);
      const st={wait:["wait","لسه"],done:["done","خلصت"],off:["off","اتلغى"]}[it.status||"wait"];
      const href=mapHref(c.location);
      return`<div class="slot ${it.status==="off"?"is-off":""} ${now?"now":""}" data-id="${it.id}" role="button" tabindex="0">
        <div class="time"><b>${s.h}</b><span>${s.p}${it.end?" · لحد "+tStr(it.end):""}</span></div>
        <div class="info">
          <div class="name"><span>${esc(c.name)}</span><span class="st ${st[0]}">${now?"دلوقتي":st[1]}</span></div>
          ${c.area||it.note?`<div class="meta">${esc([c.area,it.note].filter(Boolean).join(" · "))}</div>`:""}
          <div class="acts">
            <button class="pill" data-cycle="${it.id}">${it.status==="done"?"↺ رجّعها لسه":"✓ خلصت"}</button>
            ${href?`<a class="pill" href="${esc(href)}" target="_blank" rel="noopener">${ICON.map} الخريطة</a>`:""}
            ${c.phone?`<a class="pill" href="tel:${esc(c.phone.replace(/[^\d+]/g,""))}">${ICON.call} اتصل</a>`:""}
            ${it.repeat?`<span class="rep">↻ كل ${DAYS[wd]}</span>`:""}
          </div>
        </div></div>`}).join("")+'</div>';
  }
  if(d&&d.transport.length){
    const fs=fareSum(d),cap=fareCap(),owed=fareOwed(d),due=refundDue(d),pct=Math.min(100,fs/cap*100);
    h+=`<div class="card stack" style="${owed?"border-color:var(--fare)":""}">
      <div class="daytoggle"><div><b>مواصلات السناتر ${isT?"النهارده":"اليوم ده"}</b><div class="muted small">${fmt(fs)} من حد ${fmt(cap)} ج.م</div></div><b style="font-family:var(--head);font-size:1.2rem;color:${owed?"var(--fare)":"var(--fg)"}">${fmt(fs)}</b></div>
      <div style="height:8px;background:var(--bg);border-radius:8px;overflow:hidden"><s style="display:block;height:100%;width:${pct}%;background:${owed?"var(--fare)":"var(--money)"};border-radius:8px"></s></div>
      ${owed?(due?`<div class="confirm" style="flex-direction:row;align-items:center"><span style="flex:1">عدّيت الحد بـ <b>${fmt(owed)} ج.م</b>. الفرق ده على صاحب الشغل.</span><button class="btn ink sm" id="refundDay">استلمتهم</button></div>`
        :`<div class="daytoggle"><span class="small" style="color:var(--money);font-weight:600">✓ استلمت ${fmt(refundOf(d))} ج.م من صاحب الشغل</span><button class="link" id="refundUndo" style="color:var(--muted)">تراجع</button></div>`)
        :`<span class="muted small">فاضلك ${fmt(cap-fs)} ج.م قبل ما صاحب الشغل يتحمل الباقي.</span>`}
    </div>`;
  }
  if(d)h+=`<div class="card stack" id="wageCard">
    <div class="daytoggle"><div><b>يومية السناتر</b><div class="muted small">${d.worked===false?"اليوم ده مش هيتحسب فيه يومية":cpayOf(d)?"✓ اتقبضت يوم "+shortDate(cpayOf(d).date):fmt(d.wage)+" ج.م ليك، بتتقبض مرة واحدة آخر الأسبوع"}</div></div>
    <label class="switch"><input type="checkbox" id="worked" ${d.worked!==false?"checked":""} aria-label="اليومية محسوبة"><span></span></label></div>
    <div class="field">قيمة اليومية لليوم ده<input type="number" inputmode="decimal" id="wage" class="num" value="${d.wage}"></div></div>`;
  else if(S.centers.length)h+=`<button class="link" id="wageOnly" style="align-self:flex-start">اشتغلت في السناتر من غير ميعاد متسجل؟ سجّل اليومية</button>`;
  h+=`<div class="sec-h"><h2>ملاحظات</h2></div><textarea class="note" id="note" placeholder="أي حاجة عايز تفتكرها عن اليوم ده">${esc(S.notes[cur]||"")}</textarea>`;
  $("#main").innerHTML=h;

  $$("[data-paysub]").forEach(b=>b.onclick=()=>{const s=S.subs.find(x=>x.id===b.dataset.paysub);if(!s)return;
    S.tx.push({id:uid(),type:"out",amount:+s.amount,cat:s.cat||"subs",note:s.name,date:today(),ts:Date.now(),subId:s.id,subMonth:today().slice(0,7),pocket:S.lastPocket||"other"});save();render();toast("اتسجل "+s.name+" "+fmt(s.amount)+" ج.م")});
  $$("[data-skipsub]").forEach(b=>b.onclick=()=>{S.subSkip[b.dataset.skipsub+":"+today().slice(0,7)]=1;save();render();toast("مش هيتحسب الشهر ده")});
  $$("[data-q]").forEach(b=>b.onclick=()=>b.dataset.q==="fare"?fareSheet(S.centers.length&&(getDay(cur)?.items||[]).length?"center":"other"):txSheet(b.dataset.q));
  $("#goRefunds")&&($("#goRefunds").onclick=()=>go("centers"));
  $("#goMove").onclick=()=>moveSheet();
  $("#goCpay")&&($("#goCpay").onclick=()=>cpaySheet());
  $$("[data-pkset]").forEach(b=>b.onclick=()=>pocketSheet(b.dataset.pkset));
  $("#refundDay")&&($("#refundDay").onclick=()=>{const v=markRefund(cur);save();render();toast("اتسجل "+fmt(v)+" ج.م من صاحب الشغل")});
  $("#refundUndo")&&($("#refundUndo").onclick=()=>{delete getDay(cur).refund;save();render();toast("اتلغى تسجيل الاستلام")});
  bindLedger($("#main"));
  $("#cafeShift").onchange=e=>{if(e.target.checked)S.cafe.shifts[cur]=1;else delete S.cafe.shifts[cur];save();render()};
  $("#useTpl")&&($("#useTpl").onclick=()=>{const day=ensureDay(cur);tpl.forEach(t=>day.items.push({id:uid(),centerId:t.centerId,start:t.start,end:t.end,status:"wait",note:"",repeat:true}));save();render();toast("اتحط جدول "+DAYS[wd])});
  $("#addSlot").onclick=()=>slotSheet();
  $("#addFare").onclick=()=>fareSheet();
  $("#wageOnly")&&($("#wageOnly").onclick=()=>{const day=ensureDay(cur);day.touched=true;save();render();toast("اتسجلت يومية "+fmt(day.wage)+" ج.م")});
  $$(".slot").forEach(el=>{
    const open=()=>slotSheet(el.dataset.id);
    el.addEventListener("click",e=>{if(e.target.closest("a,button"))return;open()});
    el.addEventListener("keydown",e=>{if(e.key==="Enter")open()});
  });
  $$("[data-cycle]").forEach(b=>b.onclick=()=>{const it=getDay(cur).items.find(i=>i.id===b.dataset.cycle);it.status=it.status==="done"?"wait":"done";save();render()});
  $("#worked")&&($("#worked").onchange=e=>{const day=ensureDay(cur);day.worked=e.target.checked;day.touched=true;cleanupDay(cur);save();render()});
  $("#wage")&&($("#wage").onchange=e=>{const day=ensureDay(cur);day.wage=+e.target.value||0;day.touched=true;save();renderTop()});
  let nt;$("#note").oninput=e=>{clearTimeout(nt);nt=setTimeout(()=>{const v=e.target.value.trim();if(v)S.notes[cur]=v;else delete S.notes[cur];save()},400)};
}

/* ================= sheets ================= */
function openSheet(html,bind){
  $("#sheetBody").innerHTML=html;const sc=$("#scrim"),sh=$("#sheet");
  sc.hidden=false;sh.hidden=false;sh.scrollTop=0;requestAnimationFrame(()=>{sc.classList.add("open");sh.classList.add("open")});
  bind&&bind();sc.onclick=closeSheet;
  const f=sh.querySelector("[data-autofocus]");f&&setTimeout(()=>f.focus(),260);
}
function closeSheet(){const sc=$("#scrim"),sh=$("#sheet");sc.classList.remove("open");sh.classList.remove("open");setTimeout(()=>{sc.hidden=true;sh.hidden=true},250)}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet()});
function delConfirm(id,msg){return`<div id="${id}" class="confirm" hidden><span>${msg}</span><div><button class="btn danger" data-yes type="button">أيوه امسح</button><button class="btn ghost" data-no type="button">لا</button></div></div>`}
function bindDel(btnSel,boxSel,onYes){const b=$(btnSel),box=$(boxSel);if(!b||!box)return;b.onclick=()=>box.hidden=false;box.querySelector("[data-no]").onclick=()=>box.hidden=true;box.querySelector("[data-yes]").onclick=onYes}

/* --- صرف / دخل / أجل --- */
function txSheet(type,id){
  let rec=null;
  if(id){rec=type==="tab"?S.cafe.tabs.find(t=>t.id===id):S.tx.find(t=>t.id===id);if(!rec)return;if(type!=="tab")type=rec.type}
  if(type==="adj"){walletSheet();return}
  if(type==="move"){moveSheet(id);return}
  if(type==="open"){pocketSheet(rec.pocket);return}
  type=type||"out";
  let cat=rec?.cat||(type==="in"?"extra":"food");
  let pk=rec?.pocket||(type==="in"?"other":(S.lastPocket||"other"));
  const bal=pocketBalances();
  const date=rec?.date||cur;
  const QA={out:[5,10,20,50,100,200],in:[50,100,200,500,1000],tab:[10,20,30,50,100]};
  const title={out:"صرفت",in:"دخلي فلوس",tab:"أجل من الكافتيريا"};
  const ph={out:"اشتريت إيه؟ مثلاً: شاورما مع صحابي",in:"منين؟ مثلاً: درس خصوصي",tab:"خدت إيه؟ مثلاً: علبة سجاير، دوا"};
  const chipsHtml=t=>(t==="in"?IN_CATS:OUT_CATS).map(c=>`<button type="button" class="chip" data-cat="${c[0]}" aria-pressed="${c[0]===cat}"><i style="background:${c[2]}"></i>${c[1]}</button>`).join("");
  openSheet(`<h3 id="txTitle">${rec?"تعديل":title[type]}</h3><div class="stack">
    ${rec?"":`<div class="seg" id="txSeg"><button type="button" class="out" data-t="out" aria-pressed="${type==="out"}">صرف</button><button type="button" class="in" data-t="in" aria-pressed="${type==="in"}">دخل</button><button type="button" class="tab" data-t="tab" aria-pressed="${type==="tab"}">أجل كافتيريا</button></div>`}
    <label class="field">المبلغ (ج.م)<input type="number" inputmode="decimal" id="txAmt" class="num bigamt" value="${rec?rec.amount:""}" placeholder="0" data-autofocus></label>
    <div class="chips" id="txQuick"></div>
    <label class="field" id="txNoteL">${type==="tab"?"خدت إيه":"على إيه"}<input id="txNote" value="${esc(rec?.note||"")}" placeholder="${ph[type]}"></label>
    <div class="field" id="txCatF">الفئة<div class="chips" id="txCats">${chipsHtml(type)}</div></div>
    <div class="field" id="txPkF"><span id="txPkL">${type==="in"?"دخلت في أنهو فلوس":"اتدفعت من أنهو فلوس"}</span>${pocketChips(pk,bal,"txPk")}</div>
    <p class="hint" id="txTabHint" ${type==="tab"?"":"hidden"}>الأجل مش بيطلع من جيبك دلوقتي، بيتخصم من مرتب الكافتيريا آخر الشهر.</p>
    <label class="field">التاريخ<input type="date" id="txDate" value="${date}"></label>
    ${rec?delConfirm("txConfirm","هتمسح الحركة دي؟"):""}
  </div><div class="foot"><button class="btn sun" id="txSave" type="button">${rec?"احفظ":"سجّل"}</button>${rec?`<button class="btn danger" id="txDel" type="button">امسح</button>`:`<button class="btn ghost" id="txCancel" type="button">إلغاء</button>`}</div>`,()=>{
    const paint=()=>{
      $("#txQuick").innerHTML=QA[type].map(a=>`<button type="button" class="chip" data-a="${a}">${a}</button>`).join("");
      $$("#txQuick [data-a]").forEach(b=>b.onclick=()=>{$("#txAmt").value=b.dataset.a});
      $("#txCatF").hidden=type==="tab";$("#txTabHint").hidden=type!=="tab";$("#txPkF").hidden=type==="tab";
      $("#txPkL").textContent=type==="in"?"دخلت في أنهو فلوس":"اتدفعت من أنهو فلوس";
      $("#txNote").placeholder=ph[type];$("#txNoteL").firstChild.textContent=type==="tab"?"خدت إيه":"على إيه";
      if(!rec)$("#txTitle").textContent=title[type];
      if(type!=="tab"){
        const list=type==="in"?IN_CATS:OUT_CATS;if(!list.some(c=>c[0]===cat))cat=list[0][0];
        $("#txCats").innerHTML=chipsHtml(type);
        $$("#txCats .chip").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;$$("#txCats .chip").forEach(x=>x.setAttribute("aria-pressed",x===b))});
      }
    };
    paint();bindPocketChips("txPk",v=>pk=v);
    $$("#txSeg button").forEach(b=>b.onclick=()=>{type=b.dataset.t;$$("#txSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b));paint()});
    $("#txCancel")&&($("#txCancel").onclick=closeSheet);
    bindDel("#txDel","#txConfirm",()=>{
      if(type==="tab")S.cafe.tabs=S.cafe.tabs.filter(t=>t.id!==id);else S.tx=S.tx.filter(t=>t.id!==id);
      save();closeSheet();render();toast("اتمسحت");
    });
    $("#txSave").onclick=()=>{
      const amount=+$("#txAmt").value;if(!(amount>0)){toast("اكتب المبلغ");$("#txAmt").focus();return}
      const dt=$("#txDate").value||cur,note=$("#txNote").value.trim();
      if(type==="tab"){
        if(rec)Object.assign(rec,{amount,note,date:dt});else S.cafe.tabs.push({id:uid(),amount,note,date:dt,ts:Date.now()});
        toast("اتسجل أجل "+fmt(amount)+" ج.م");
      }else{
        if(rec)Object.assign(rec,{type,amount,note,cat,date:dt,pocket:pk});else S.tx.push({id:uid(),type,amount,cat,note,date:dt,ts:Date.now(),pocket:pk});
        if(type==="out")S.lastPocket=pk;
        toast((type==="in"?"دخل ":"صرف ")+fmt(amount)+" ج.م · "+(type==="in"?"في ":"من ")+pocketOf(pk).name);
      }
      save();closeSheet();render();
    };
  });
}

/* --- تحويل بين الجيوب --- */
function moveSheet(id){
  const rec=id?S.tx.find(t=>t.id===id):null;const bal=pocketBalances();
  let from=rec?.from||"centers",to=rec?.to||(S.pockets.find(p=>p.id!==from&&!p.fixed)?.id||"other");
  openSheet(`<h3>${rec?"تعديل التحويل":"حوّل فلوس من جيب لجيب"}</h3><div class="stack">
    <p class="hint" style="margin:0">مثلاً: صرفت من فلوس السناتر على حاجة كانت المفروض من المرتب، أو حطيت جزء في التحويشة.</p>
    <div class="field">من${pocketChips(from,bal,"mvFrom")}</div>
    <div class="field">لـ${pocketChips(to,bal,"mvTo")}</div>
    <label class="field">المبلغ (ج.م)<input type="number" inputmode="decimal" id="mvAmt" class="num bigamt" value="${rec?rec.amount:""}" placeholder="0" data-autofocus></label>
    ${rec?delConfirm("mvConfirm","هتمسح التحويل ده؟"):""}
  </div><div class="foot"><button class="btn sun" id="mvSave" type="button">${rec?"احفظ":"حوّل"}</button>${rec?`<button class="btn danger" id="mvDel" type="button">امسح</button>`:`<button class="btn ghost" id="mvCancel" type="button">إلغاء</button>`}</div>`,()=>{
    bindPocketChips("mvFrom",v=>from=v);bindPocketChips("mvTo",v=>to=v);
    $("#mvCancel")&&($("#mvCancel").onclick=closeSheet);
    bindDel("#mvDel","#mvConfirm",()=>{S.tx=S.tx.filter(t=>t.id!==id);save();closeSheet();render();toast("اتمسح التحويل")});
    $("#mvSave").onclick=()=>{const a=+$("#mvAmt").value;if(!(a>0)){toast("اكتب المبلغ");return}if(from===to){toast("اختار جيبين مختلفين");return}
      if(rec)Object.assign(rec,{from,to,amount:a});else S.tx.push({id:uid(),type:"move",from,to,amount:a,cat:"move",date:cur,ts:Date.now()});
      save();closeSheet();render();toast("اتحوّل "+fmt(a)+" ج.م لـ "+pocketOf(to).name)};
  });
}

/* --- جيب جديد / تعديل جيب --- */
function pocketSheet(id){
  const p=id?S.pockets.find(x=>x.id===id):null;const now=p?(pocketBalances()[p.id]||0):0;
  openSheet(`<h3>${p?esc(p.name):"جيب فلوس جديد"}</h3><div class="stack">
    <label class="field">فيه كام دلوقتي (ج.م)<input type="number" inputmode="decimal" id="pkBal" class="num bigamt" value="${p?now:""}" placeholder="0" ${p?"data-autofocus":""}></label>
    <p class="hint" style="margin:0">مش عارف بالظبط؟ اكتب رقم تقريبي واصرف منه عادي. لما تعرف الرقم الحقيقي (زي باقي المرتب) ارجع هنا وعدّله.</p>
    <label class="field">الاسم<input id="pkName" value="${esc(p?.name||"")}" placeholder="مثلاً: تحويشة، فودافون كاش، فلوس الجمعية" ${p?"":"data-autofocus"}></label>
    ${p&&!p.fixed?delConfirm("pkConfirm","هتمسح الجيب ده؟ الحركات القديمة هتفضل متسجلة."):""}
  </div><div class="foot"><button class="btn sun" id="pkSave" type="button">احفظ</button>${p&&!p.fixed?`<button class="btn danger" id="pkDel" type="button">امسح</button>`:`<button class="btn ghost" id="pkCancel" type="button">إلغاء</button>`}</div>`,()=>{
    $("#pkCancel")&&($("#pkCancel").onclick=closeSheet);
    bindDel("#pkDel","#pkConfirm",()=>{S.pockets=S.pockets.filter(x=>x.id!==id);if(S.lastPocket===id)S.lastPocket="other";save();closeSheet();render();toast("اتمسح الجيب")});
    $("#pkSave").onclick=()=>{const name=$("#pkName").value.trim();if(!name){toast("اكتب الاسم");return}
      let pid=p?.id;
      if(p)p.name=name;else{pid="p"+uid();S.pockets.push({id:pid,name,color:POCKET_COLORS[(S.pockets.length-3)%POCKET_COLORS.length]})}
      const raw=$("#pkBal").value;
      if(raw!==""){
        /* أول مرة: ابدأ الحساب من كل اللي اتسجل قبل كده علشان الأرقام ما تتلخبطش */
        if(!S.wallet)S.wallet={since:"0000-01-01",base:0,at:Date.now(),pocket:"other"};
        const df=Math.round((+raw-(pocketBalances()[pid]||0))*100)/100;
        if(df!==0)S.tx.push({id:uid(),type:"open",amount:df,pocket:pid,cat:"open",note:"",date:today(),ts:Date.now()});
      }
      save();closeSheet();render();toast(raw!==""?name+": "+fmt(+raw)+" ج.م":"اتحفظ "+name)};
  });
}

/* --- قبض السناتر (مرة في الأسبوع) --- */
function cpaySheet(id){
  if(id){
    const p=S.cpays.find(x=>x.id===id);if(!p)return;
    openSheet(`<h3>قبض السناتر · ${shortDate(p.date)}</h3><div class="stack">
      <div class="big"><span class="lbl">${p.old?"اتقبض قبل ما تسجل جيبك (ما دخلش الجيب)":"دخل فلوس السناتر"}</span><span class="v">${fmt(p.amount)} <small>ج.م</small></span></div>
      <div>${p.days.map(d=>`<div class="crow"><span>${shortDate(d)}</span><b>${fmt(wageOf(S.days[d]))}</b></div>`).join("")}</div>
      ${p.refunds&&p.refunds.length?`<span class="muted small">ومعاهم مواصلات صاحب الشغل لـ ${p.refunds.length} يوم</span>`:""}
      ${delConfirm("cpConfirm","هتمسح القبض ده؟ الأيام هترجع «لسه ما اتقبضتش».")}
    </div><div class="foot"><button class="btn danger" id="cpDel" type="button">امسح</button><button class="btn ghost" id="cpClose" type="button">قفل</button></div>`,()=>{
      $("#cpClose").onclick=closeSheet;
      bindDel("#cpDel","#cpConfirm",()=>{
        Object.values(S.days).forEach(d=>{if(d.paidBy===id)delete d.paidBy;if(d.refund&&d.refund.viaPay===id)delete d.refund});
        S.cpays=S.cpays.filter(x=>x.id!==id);save();closeSheet();render();toast("اتمسح القبض");
      });
    });
    return;
  }
  const up=unpaidDays();if(!up.length){toast("مفيش يوميات لسه ما اتقبضتش");return}
  const ws=weekStart(today());
  const sel=new Set(up.filter(d=>d.date<ws).map(d=>d.date));if(!sel.size)up.forEach(d=>sel.add(d.date));
  let touched=false,withRef=true,old=false;
  const refOf=d=>refundOf(d)?0:refundDue(d);
  const calc=()=>{let w=0,r=0;up.forEach(d=>{if(sel.has(d.date)){w+=wageOf(d);r+=refOf(d)}});return{w,r}};
  openSheet(`<h3>قبضت من السناتر</h3><div class="stack">
    <p class="hint" style="margin:0">علّم الأيام اللي اتقبضت. الفلوس هتدخل «${esc(pocketOf("centers").name)}».</p>

function slotSheet(id){
  if(!S.centers.length){toast("ضيف سنتر الأول");go("centers");return}
  const day=getDay(cur);const it=id?day.items.find(i=>i.id===id):null;
  const wd=parse(cur).getDay();
  let sel=it?it.centerId:(S.centers.length===1?S.centers[0].id:null),status=it?.status||"wait";
  const origCenter=it?.centerId,origStart=it?.start;
  openSheet(`<h3>${it?"تعديل الميعاد":"ميعاد جديد"}</h3>
  <div class="stack">
    <div class="field">السنتر<div class="chips" id="cChips">${S.centers.map(c=>`<button type="button" class="chip" data-c="${c.id}" aria-pressed="${c.id===sel}">${esc(c.name)}</button>`).join("")}</div></div>
    <div class="row"><label class="field">من<input type="time" id="sStart" value="${it?.start||""}"></label><label class="field">لحد<input type="time" id="sEnd" value="${it?.end||""}"></label></div>
    <label class="field">ملاحظة<input id="sNote" value="${esc(it?.note||"")}" placeholder="مثلاً: مستر أحمد، تالتة ثانوي"></label>
    ${it?`<div class="field">الحالة<div class="seg" id="sSeg"><button type="button" class="wait" data-s="wait" aria-pressed="${status==="wait"}">لسه</button><button type="button" class="done" data-s="done" aria-pressed="${status==="done"}">خلصت</button><button type="button" class="off" data-s="off" aria-pressed="${status==="off"}">اتلغى</button></div></div>`:""}
    <label class="check"><input type="checkbox" id="sRep" ${it?.repeat?"checked":""}> كرر الميعاد ده كل ${DAYS[wd]}</label>

  </div>
  <div class="foot"><button class="btn sun" id="sSave" type="button">${it?"احفظ":"ضيف للجدول"}</button>${it?`<button class="btn danger" id="sDel" type="button">امسح</button>`:`<button class="btn ghost" id="sCancel" type="button">إلغاء</button>`}</div>`,()=>{
    $$("#cChips .chip").forEach(b=>b.onclick=()=>{sel=b.dataset.c;$$("#cChips .chip").forEach(x=>x.setAttribute("aria-pressed",x===b))});
    $$("#sSeg button").forEach(b=>b.onclick=()=>{status=b.dataset.s;$$("#sSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
    $("#sCancel")&&($("#sCancel").onclick=closeSheet);
    bindDel("#sDel","#sConfirm",()=>{day.items=day.items.filter(i=>i.id!==id);cleanupDay(cur);save();closeSheet();render();toast("اتمسح الميعاد")});
    $("#sSave").onclick=()=>{
      if(!sel){toast("اختار السنتر");return}
      const start=$("#sStart").value,end=$("#sEnd").value;
      if(!start){toast("حط ميعاد البداية");$("#sStart").focus();return}
      if(end&&end<=start){toast("ميعاد النهاية لازم يكون بعد البداية");return}
      const d=ensureDay(cur);const rep=$("#sRep").checked;
      const data={centerId:sel,start,end,note:$("#sNote").value.trim(),status,repeat:rep};
      let item=it;if(item)Object.assign(item,data);else{item={id:uid(),...data};d.items.push(item)}
      const list=(S.weekly[wd]||[]).filter(t=>!(it&&t.centerId===origCenter&&t.start===origStart)&&!(t.centerId===sel&&t.start===start));
      if(rep)list.push({centerId:sel,start,end});
      list.sort((a,b)=>a.start.localeCompare(b.start));S.weekly[wd]=list;
      save();closeSheet();render();toast(it?"اتحفظ الميعاد":"اتضاف "+(center(sel)?.name||"")+" "+tStr(start));
    };
  });

function fareSheet(kind){
  kind=kind||"center";
  const bal=pocketBalances();let pk=null,pkTouched=false;
  const QA=[5,7,10,12,15,20,25,30,50];const QN=["ميكروباص","توكتوك","مترو","أتوبيس","تاكسي","أوبر"];
  openSheet(`<h3>مواصلات</h3><div class="stack">
    <div class="seg" id="fSeg" style="grid-template-columns:1fr 1fr"><button type="button" class="out" data-k="center" aria-pressed="${kind==="center"}">مواصلات سناتر</button><button type="button" class="wait" data-k="other" aria-pressed="${kind==="other"}">مواصلات عادية</button></div>
    <p class="hint" id="fKindHint"></p>
    <label class="field">المبلغ (ج.م)<input type="number" inputmode="decimal" id="fAmt" class="num bigamt" placeholder="0" data-autofocus></label>
    <div class="chips">${QA.map(a=>`<button type="button" class="chip" data-a="${a}">${a}</button>`).join("")}</div>
    <div id="fCap" class="small"></div>
    <label class="field">رايح فين / بإيه<input id="fNote" placeholder="مثلاً: ميكروباص لسنتر النور"></label>
    <div class="chips">${QN.map(n=>`<button type="button" class="chip" data-n="${n}">${n}</button>`).join("")}</div>
    <div class="field">اتدفعت من أنهو فلوس<div id="fPkBox"></div></div>
  </div><div class="foot"><button class="btn sun" id="fSave" type="button">سجل المشوار</button><button class="btn ghost" id="fCancel" type="button">إلغاء</button></div>`,()=>{
    const live=()=>{
      $("#fKindHint").textContent=kind==="center"?"رايح أو جاي من سنتر. بتتحسب على حد الـ "+fmt(fareCap())+" ج.م في اليوم.":"شغل الكافتيريا، خروجة، أي مشوار تاني. بتتحسب في الصرف العادي.";
      $("#fNote").placeholder=kind==="center"?"مثلاً: ميكروباص لسنتر النور":"مثلاً: رايح الكافتيريا";
      if(!pkTouched){pk=S.lastPocket||"other";$("#fPkBox").innerHTML=pocketChips(pk,bal,"fPk");bindPocketChips("fPk",v=>{pk=v;pkTouched=true})}
      const box=$("#fCap");if(kind!=="center"){box.innerHTML="";return}
      const before=fareSum(getDay(cur)),a=+$("#fAmt").value||0,after=before+a,cap=fareCap();
      box.innerHTML=after>cap?`<span style="color:var(--fare);font-weight:600">مواصلات السناتر اليوم هتبقى ${fmt(after)} ج.م · صاحب الشغل عليه ${fmt(after-cap)} ج.م</span>`
        :`<span class="muted">مواصلات السناتر اليوم: ${fmt(after)} من ${fmt(cap)} ج.م</span>`;
    };
    live();$("#fAmt").oninput=live;
    $$("#fSeg button").forEach(b=>b.onclick=()=>{kind=b.dataset.k;$$("#fSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b));live()});
    $$("[data-a]").forEach(b=>b.onclick=()=>{$("#fAmt").value=b.dataset.a;live()});
    $$("[data-n]").forEach(b=>b.onclick=()=>{const f=$("#fNote");f.value=f.value?f.value+" "+b.dataset.n:b.dataset.n});
    $("#fCancel").onclick=closeSheet;
    $("#fSave").onclick=()=>{const a=+$("#fAmt").value;if(!(a>0)){toast("اكتب المبلغ");$("#fAmt").focus();return}
      const note=$("#fNote").value.trim();
      if(kind==="other"){S.tx.push({id:uid(),type:"out",amount:a,cat:"transport",note,date:cur,ts:Date.now(),pocket:pk});S.lastPocket=pk;save();closeSheet();render();toast("اتسجل "+fmt(a)+" ج.م مواصلات عادية · من "+pocketOf(pk).name);return}
      const d=ensureDay(cur);const before=fareOwed(d);d.transport.push({id:uid(),amount:a,note,ts:Date.now(),pocket:pk});const after=fareOwed(d);
      save();closeSheet();render();
      toast(after>before?"⚠ عدّيت الـ "+fmt(fareCap())+" ج.م · صاحب الشغل عليه "+fmt(after)+" ج.م النهارده":"اتسجل "+fmt(a)+" ج.م مواصلات سناتر");
    };
  });
}

  const m=cafeMonth,a=m+"-01",b=lastDay(m);
  const tabs=S.cafe.tabs.filter(t=>t.date>=a&&t.date<=b).sort((x,y)=>y.date.localeCompare(x.date)||(y.ts||0)-(x.ts||0));
  const tabSum=tabs.reduce((s,t)=>s+(+t.amount||0),0);
  const shifts=Object.keys(S.cafe.shifts).filter(d=>d>=a&&d<=b).sort();
  const pay=S.cafe.pays.find(p=>p.month===m);
  let h=`<div class="card stack">
    <div class="mnav"><button class="iconbtn" id="cmPrev" aria-label="الشهر اللي فات">${ICON.prev}</button><h3>${monthName(m)}</h3><button class="iconbtn" id="cmNext" aria-label="الشهر الجاي">${ICON.next}</button></div>

    ${pay?`<div class="eq"><div><span>قبضت</span><b>${fmt(pay.received)}</b></div><i>+</i><div><span>الأجل</span><b style="color:var(--tab)">${fmt(tabSum)}</b></div><i>=</i><div><span>المرتب الحقيقي</span><b style="color:var(--money)">${fmt(pay.received+tabSum)}</b></div></div>
      ${shifts.length?`<span class="muted small">يعني الشيفت طالع عليك بحوالي ${fmt(Math.round((pay.received+tabSum)/shifts.length))} ج.م</span>`:""}
      <button class="btn ghost" id="payEdit">تعديل القبض</button>`
    :`<button class="btn sun" id="payAdd">قبضت مرتب ${MONTHS[+m.slice(5)-1]}؟ سجّله</button>`}
  </div>
  <div class="sec-h"><h2>الأجل</h2><button class="link" id="tabAdd" style="color:var(--tab)">+ أجل</button></div>
  <div class="card">${tabs.length?`<div class="ledger">${tabs.map(t=>ledgerRow({date:t.date,k:"tab",amount:+t.amount,cat:"tab",label:t.note||"أجل من الكافتيريا",src:"tab",ref:t.id},true)).join("")}</div>`:`<div class="empty" style="padding:10px"><span>مفيش أجل متسجل في ${monthName(m)}. كل حاجة تاخدها على المرتب سجلها من زرار +.</span></div>`}</div>`;
  if(shifts.length)h+=`<div class="sec-h"><h2>أيام الشغل</h2></div><div class="card"><div class="chips">${shifts.map(d=>`<span class="chip" style="cursor:default">${shortDate(d)}</span>`).join("")}</div></div>`;
  const hist=S.cafe.pays.slice().sort((x,y)=>y.month.localeCompare(x.month));
  if(hist.length)h+=`<div class="sec-h"><h2>المرتبات اللي فاتت</h2></div><div class="card">${hist.map(p=>{const t=S.cafe.tabs.filter(x=>x.date.startsWith(p.month)).reduce((s,x)=>s+(+x.amount||0),0);
    return`<div class="crow"><span>${monthName(p.month)}</span><span class="muted small">قبض ${fmt(p.received)} + أجل ${fmt(t)}</span><b>${fmt(p.received+t)}</b></div>`}).join("")}</div>`;
  $("#main").innerHTML=h;
  $("#cmPrev").onclick=()=>{cafeMonth=addMonths(cafeMonth,-1);render()};
  $("#cmNext").onclick=()=>{cafeMonth=addMonths(cafeMonth,1);render()};
  $("#payAdd")&&($("#payAdd").onclick=()=>paySheet(m));
  $("#payEdit")&&($("#payEdit").onclick=()=>paySheet(m,pay.id));
  $("#tabAdd").onclick=()=>txSheet("tab");
  bindLedger($("#main"));
}

  h+=`<div class="sec-h"><h2>أماكن الشغل</h2><button class="link" id="addC">+ سنتر جديد</button></div>`;

  else h+=S.centers.map(c=>{
    const visits=Object.values(S.days).filter(d=>d.date.startsWith(mk)&&d.items.some(i=>i.centerId===c.id&&i.status!=="off")).length;

      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">

        ${c.phone?`<a class="pill" href="tel:${esc(c.phone.replace(/[^\d+]/g,""))}">${ICON.call} <span class="num" dir="ltr">${esc(c.phone)}</span></a>`:""}

/* ================= render: money (التقرير) ================= */
function rangeOf(){
  if(period==="day")return[anchor,anchor,anchor===today()?"النهارده":shortDate(anchor)];
  if(period==="week"){const a=weekStart(anchor),b=addDays(a,6);return[a,b,"من "+shortDate(a)+" لـ "+shortDate(b)]}
  const ym=anchor.slice(0,7);return[ym+"-01",lastDay(ym),monthName(ym)];
}
function renderMoney(){
  const[a,b,label]=rangeOf();
  const ev=events(a,b),T=sums(ev);
  let h=`<div class="periods" role="group" aria-label="الفترة">${[["day","يوم"],["week","أسبوع"],["month","شهر"]].map(([k,l])=>`<button data-p="${k}" aria-pressed="${period===k}">${l}</button>`).join("")}</div>
  <div class="card">
    <div class="mnav" style="margin-bottom:8px"><button class="iconbtn" id="rPrev" aria-label="اللي فات">${ICON.prev}</button><h3>${label}</h3><button class="iconbtn" id="rNext" aria-label="اللي جاي">${ICON.next}</button></div>
    <div class="big"><span class="lbl">${T.net>=0?"فاضل معاك من الفترة دي":"صرفت أكتر ما دخلت"}</span><span class="v ${T.net<0?"neg":""}">${fmt(T.net)} <small>ج.م</small></span></div>`;
  if(period!=="day"){
    const bars=[];let x=a;while(x<=b){bars.push({d:x,v:sums(events(x,x)).spend});x=addDays(x,1)}
    const mx=Math.max(1,...bars.map(z=>z.v));
    h+=`<div class="bars" aria-hidden="true">${bars.map(z=>`<i class="${z.v<=0?"zero":""} ${z.d===today()?"today":""}" style="height:${Math.max(3,z.v/mx*100)}%"></i>`).join("")}</div><span class="muted small">صرفك يوم بيوم</span>`;
  }
  h+=`<div class="split"><div class="g"><span>دخل</span><b>${fmt(T.inc)}</b></div><div class="f"><span>صرف</span><b>${fmt(T.spend)}</b></div><div><span>أجل كافتيريا</span><b style="color:var(--tab)">${fmt(T.tab)}</b></div></div></div>`;

  /* الصرف حسب الفئة */
  const byCat={};ev.filter(e=>e.k==="out").forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount);
  const cats=Object.entries(byCat).sort((p,q)=>q[1]-p[1]);
  if(cats.length){
    const[topId,topV]=cats[0],ti=catInfo(topId),pct=Math.round(topV/T.spend*100);
    h+=`<div class="sec-h"><h2>أكبر فئة</h2></div><div class="card top1"><span class="ring" style="background:color-mix(in srgb,${ti.color} 18%,transparent);color:${ti.color}">${pct}%</span><p><b>${ti.name}</b> خدت ${fmt(topV)} ج.م من صرفك<br><span class="muted small">من كل 100 جنيه صرفتهم، ${pct} راحوا على ${ti.name}</span></p></div>
    <div class="sec-h"><h2>صرفت فين</h2></div><div class="card">${cats.map(([id,v])=>{const ci=catInfo(id);return`<div class="catrow"><span class="nm"><i style="background:${ci.color}"></i>${ci.name}</span><span class="v">${fmt(v)}</span><span class="bar"><s style="width:${Math.max(2,v/topV*100)}%;background:${ci.color}"></s></span></div>`}).join("")}</div>`;
  }
  /* الدخل حسب المصدر */
  const byIn={};ev.filter(e=>e.k==="in").forEach(e=>byIn[e.cat]=(byIn[e.cat]||0)+e.amount);
  const ins=Object.entries(byIn).sort((p,q)=>q[1]-p[1]);
  if(ins.length)h+=`<div class="sec-h"><h2>الدخل جه منين</h2></div><div class="card">${ins.map(([id,v])=>{const ci=catInfo(id);return`<div class="crow"><span style="display:flex;align-items:center;gap:8px"><i style="width:10px;height:10px;border-radius:50%;background:${ci.color}"></i>${ci.name}</span><b>${fmt(v)}</b></div>`}).join("")}</div>`;
  /* كل جيب: دخله كام وطلع منه كام وعلى إيه */
  {const per={};S.pockets.forEach(p=>per[p.id]={inc:0,out:0,cats:{}});
   for(const e of ev){
     if(e.k==="move"){(per[e.from]||(per[e.from]={inc:0,out:0,cats:{}})).out+=e.amount;(per[e.to]||(per[e.to]={inc:0,out:0,cats:{}})).inc+=e.amount;per[e.from].cats.move=(per[e.from].cats.move||0)+e.amount;continue}
     if(!e.pocket)continue;const r=per[e.pocket]||(per[e.pocket]={inc:0,out:0,cats:{}});
     if(e.k==="in"||e.k==="pay"||((e.k==="adj"||e.k==="open")&&e.amount>0))r.inc+=Math.abs(e.amount);
     else if(e.k==="out"||((e.k==="adj"||e.k==="open")&&e.amount<0)){r.out+=Math.abs(e.amount);r.cats[e.cat]=(r.cats[e.cat]||0)+Math.abs(e.amount)}
   }
   const rows=Object.entries(per).filter(([,r])=>r.inc||r.out);
   if(rows.length)h+=`<div class="sec-h"><h2>صرفت من أنهو فلوس</h2></div><div class="card">${rows.map(([id,r])=>{const p=pocketOf(id);const top=Object.entries(r.cats).sort((x,y)=>y[1]-x[1]).slice(0,3).map(([c,v])=>catInfo(c).name+" "+fmt(v)).join(" · ");
     return`<div class="catrow" style="grid-template-columns:1fr auto"><span class="nm"><i style="background:${p.color}"></i>${esc(p.name)}</span><span class="v" style="font-size:.85rem"><span style="color:var(--money)">+${fmt(r.inc)}</span> · <span style="color:var(--fare)">−${fmt(r.out)}</span></span>${top?`<span class="muted small" style="grid-column:1/-1">راحت على: ${esc(top)}</span>`:""}</div>`}).join("")}</div>`;}
  /* المواصلات لوحدها */
  {const cf=ev.filter(e=>e.k==="out"&&e.cat==="cfare").reduce((s,e)=>s+e.amount,0),tf=ev.filter(e=>e.k==="out"&&e.cat==="transport").reduce((s,e)=>s+e.amount,0);
   const dsr=Object.values(S.days).filter(d=>d.date>=a&&d.date<=b),ow=dsr.reduce((s,d)=>s+fareOwed(d),0),got=dsr.reduce((s,d)=>s+Math.min(refundOf(d),fareOwed(d)),0);
   if(cf||tf)h+=`<div class="sec-h"><h2>المواصلات</h2></div><div class="card">
     <div class="crow"><span>مواصلات السناتر</span><b style="color:var(--fare)">${fmt(cf)}</b></div>
     ${ow?`<div class="crow"><span class="muted">منها على صاحب الشغل</span><b>${fmt(ow)}</b></div><div class="crow"><span class="muted">استلمت منه</span><b style="color:var(--money)">${fmt(got)}</b></div>${ow-got>0?`<div class="crow"><span class="muted">لسه ليك</span><b style="color:var(--fare)">${fmt(ow-got)}</b></div>`:""}`:""}
     <div class="crow"><span>مواصلات عادية (شغل وغيره)</span><b style="color:var(--fare)">${fmt(tf)}</b></div>
     <div class="crow"><span><b>إجمالي اللي دفعته من جيبك</b></span><b>${fmt(cf+tf-got)}</b></div></div>`;}
  /* أكبر حاجات اشتريتها */
  const topBuys=ev.filter(e=>e.k==="out"||e.k==="tab").sort((p,q)=>q.amount-p.amount).slice(0,6);
  if(topBuys.length&&period!=="day")h+=`<div class="sec-h"><h2>أغلى حاجات</h2></div><div class="card"><div class="ledger">${topBuys.map(e=>ledgerRow(e,true)).join("")}</div></div>`;
  /* فلوس مش معروفة */
  const adjs=ev.filter(e=>e.k==="adj");
  if(adjs.length){const miss=adjs.filter(e=>e.amount<0).reduce((s,e)=>s-e.amount,0),extra=adjs.filter(e=>e.amount>0).reduce((s,e)=>s+e.amount,0);
    h+=`<div class="due" style="background:var(--fare-soft)"><p>${miss?`<b style="color:var(--fare)">${fmt(miss)} ج.م</b> طلعوا من جيبك من غير ما تسجلهم.`:""} ${extra?`<b style="color:var(--money)">${fmt(extra)} ج.م</b> زيادة مش متسجلة.`:""} حاول تسجل كل حاجة أول بأول.</p></div>`}
  /* الكافتيريا */
  if(period==="month"){
    const ym=anchor.slice(0,7),pay=S.cafe.pays.find(p=>p.month===ym),sh=Object.keys(S.cafe.shifts).filter(d=>d.startsWith(ym)).length;
    if(pay||sh||T.tab)h+=`<div class="sec-h"><h2>الكافتيريا</h2></div><div class="card">
      <div class="crow"><span>شيفتات</span><b>${sh}</b></div><div class="crow"><span>أجل اتخصم</span><b style="color:var(--tab)">${fmt(T.tab)}</b></div>
      <div class="crow"><span>القبض</span><b>${pay?fmt(pay.received):"لسه ما اتسجلش"}</b></div>${pay?`<div class="crow"><span>المرتب الحقيقي</span><b style="color:var(--money)">${fmt(pay.received+T.tab)}</b></div>`:""}</div>`;
    /* السناتر */
    const ds=Object.values(S.days).filter(d=>d.date.startsWith(ym));
    if(ds.length){const counts={};ds.forEach(d=>d.items.forEach(i=>{if(i.status!=="off")counts[i.centerId]=(counts[i.centerId]||0)+1}));
      const w=ds.reduce((s,d)=>s+wageOf(d),0),n=ds.filter(d=>d.worked!==false).length;
      h+=`<div class="sec-h"><h2>السناتر</h2></div><div class="card"><div class="crow"><span>أيام شغل</span><b>${n}</b></div><div class="crow"><span>اليوميات (كاملة)</span><b style="color:var(--money)">${fmt(w)}</b></div>
      ${(()=>{const un=ds.filter(d=>!cpayOf(d)).reduce((s,d)=>s+wageOf(d),0);return`<div class="crow"><span class="muted">اتقبض منها</span><b>${fmt(w-un)}</b></div>${un?`<div class="crow"><span class="muted">لسه ليك</span><b style="color:var(--fare)">${fmt(un)}</b></div>`:""}`})()}
      <span class="muted small">المواصلات مش مخصومة من هنا، هتلاقيها في قسم «المواصلات».</span>
      ${Object.entries(counts).sort((p,q)=>q[1]-p[1]).map(([id,c])=>`<div class="crow"><span class="muted">${esc(center(id)?.name||"سنتر اتمسح")}</span><span class="muted">${c} زيارة</span></div>`).join("")}</div>`}
  }
  /* يوم بيوم */
  if(period!=="day"){
    const dates=[...new Set(ev.map(e=>e.date))].sort().reverse();
    if(dates.length)h+=`<div class="sec-h"><h2>يوم بيوم</h2></div><div class="card">${dates.map(dd=>{const s=sums(events(dd,dd)),dt=parse(dd);
      return`<button class="drow" data-date="${dd}"><span class="d"><b>${dt.getDate()}</b><span>${DSHORT[dt.getDay()]}</span></span><span class="c">${s.inc?"دخل "+fmt(s.inc):""}${s.inc&&s.spend?" · ":""}${s.spend?"صرف "+fmt(s.spend):""}${!s.inc&&!s.spend&&s.tab?"أجل "+fmt(s.tab):""}</span><span class="m"><b style="${s.net<0?"color:var(--fare)":""}">${fmt(s.net)}</b></span></button>`}).join("")}</div>`;
  }
  if(!ev.length)h+=`<div class="card empty"><b>مفيش حركة في الفترة دي</b><span>سجل اللي بتصرفه والي بتقبضه من صفحة النهارده، وهنا هتلاقي الحساب كله.</span></div>`;
  $("#main").innerHTML=h;
  $$("[data-p]").forEach(x=>x.onclick=()=>{period=x.dataset.p;render()});
  const step=n=>{anchor=period==="day"?addDays(anchor,n):period==="week"?addDays(anchor,7*n):addMonths(anchor.slice(0,7),n)+"-01";render()};
  $("#rPrev").onclick=()=>step(-1);$("#rNext").onclick=()=>step(1);
  $$(".drow").forEach(x=>x.onclick=()=>{cur=x.dataset.date;go("today")});
  bindLedger($("#main"));
}

  h+=`<div class="sec-h"><h2>جيبك</h2></div><div class="card stack">
