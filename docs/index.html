  <div class="sec-h"><h2>جيوب الفلوس</h2><div class="links"><button class="link" id="pkMove">حوّل</button><button class="link" id="pkAdd">+ جيب</button></div></div><div class="card">${(()=>{const pb=pocketBalances();return S.pockets.map(p=>`<div class="crow" role="button" tabindex="0" data-pkedit="${p.id}" style="cursor:pointer"><span style="display:flex;align-items:center;gap:8px"><i style="width:10px;height:10px;border-radius:50%;background:${p.color}"></i>${esc(p.name)}${p.fixed?"":` <span class="muted small">· بتاعك</span>`}</span><b style="${(pb[p.id]||0)<0?"color:var(--fare)":""}">${fmt(pb[p.id]||0)}</b></div>`).join("")})()}
    <span class="muted small">يومية السناتر وفلوس المواصلات اللي بترجعلك بتدخل «فلوس السناتر»، والقبض بيدخل «مرتب الكافتيريا». الصرف بتختار هو طالع من أنهو فلوس. دوس على أي جيب علشان تغير اسمه.</span></div>
  <div class="sec-h"><h2>الاشتراكات الشهرية</h2><button class="link" id="subAdd">+ اشتراك</button></div><div class="card">${S.subs.length?S.subs.map(s=>`<div class="crow" role="button" tabindex="0" data-sub="${s.id}" style="cursor:pointer;${s.active===false?"opacity:.55":""}"><span><b>${esc(s.name)}</b> <span class="muted small">· يوم ${s.day} ${s.active===false?"· متوقف":""}</span></span><b>${fmt(s.amount)}</b></div>`).join("")+`<div class="crow" style="border:0"><span class="muted">في الشهر</span><b>${fmt(S.subs.filter(s=>s.active!==false).reduce((a,s)=>a+(+s.amount||0),0))} ج.م</b></div>`
    :`<span class="muted small">ضيف نتفليكس، باقة النت، الجيم، أي حاجة بتدفعها كل شهر. في يومها هيظهرلك تنبيه في صفحة النهارده تسجلها بدوسة.</span>`}</div>`;
  h+=`<div class="sec-h"><h2>التفعيلات</h2></div><div id="pushBox"><div class="card"><span class="muted small">بنتحقق من حالة الإشعارات...</span></div></div>`;
  h+=`<div class="sec-h"><h2>يومية السناتر</h2></div><div class="card stack">
    <label class="field">قيمة اليومية (ج.م)<input type="number" inputmode="decimal" id="rate" class="num" value="${S.rate}"></label>
    <span class="muted small">التغيير بيسري على الأيام الجديدة بس. الأيام اللي فاتت بتفضل بيوميتها.</span>
    <label class="field">حد مواصلات السناتر في اليوم (ج.م)<input type="number" inputmode="decimal" id="cap" class="num" value="${fareCap()}"></label>
    <span class="muted small">لو مواصلات السناتر في يوم عدّت الرقم ده، الفرق بيتحسب على صاحب الشغل.</span>
    <button class="btn ink" id="saveRate">احفظ</button></div>
  <div class="sec-h"><h2>الجدول الأسبوعي</h2></div><div class="card">${WEEK_ORDER.some(w=>(S.weekly[w]||[]).length)?WEEK_ORDER.filter(w=>(S.weekly[w]||[]).length).map(w=>`<div class="crow"><b>${DAYS[w]}</b><span class="muted small" style="text-align:left">${S.weekly[w].map(t=>esc(center(t.centerId)?.name||"")+" "+tStr(t.start)).join("، ")}</span></div>`).join(""):`<span class="muted small">لما تعلّم على «كرر الميعاد ده» وانت بتضيف ميعاد، هيظهر هنا ويتعرض عليك كل أسبوع في نفس اليوم.</span>`}</div>
  <div class="sec-h"><h2>نسخة احتياطية</h2></div><div class="card stack">
    <span class="muted small">بياناتك محفوظة على الموبايل ده بس. خد نسخة كل فترة وابعتها لنفسك على واتساب أو الإيميل، علشان لو غيرت الموبايل.</span>
    <div class="row"><button class="btn ink" id="exp">حفظ نسخة</button><button class="btn ghost" id="impBtn">استرجاع نسخة</button></div>
    <input type="file" id="imp" accept="application/json,.json" hidden>
    <div id="impConfirm" class="confirm" hidden><span id="impMsg"></span><div><button class="btn danger" id="impYes">استرجع</button><button class="btn ghost" id="impNo">لا</button></div></div>
  </div>
  <p class="muted small" style="text-align:center">مشواري · ${S.tx.length+S.cafe.tabs.length} حركة · ${Object.keys(S.days).length} يوم سناتر · ${S.centers.length} سنتر</p>`;
  $("#main").innerHTML=h;
  refreshPushBox();
  $("#inst")&&($("#inst").onclick=async()=>{deferredInstall.prompt();await deferredInstall.userChoice.catch(()=>{});deferredInstall=null;render()});
  $("#wCount").onclick=walletSheet;
  $("#subAdd").onclick=()=>subSheet();
  $("#pkAdd").onclick=()=>pocketSheet();$("#pkMove").onclick=()=>moveSheet();
  $$("[data-pkedit]").forEach(r=>{r.onclick=()=>pocketSheet(r.dataset.pkedit);r.onkeydown=e=>{if(e.key==="Enter")pocketSheet(r.dataset.pkedit)}});
  $$("[data-sub]").forEach(r=>{r.onclick=()=>subSheet(r.dataset.sub);r.onkeydown=e=>{if(e.key==="Enter")subSheet(r.dataset.sub)}});
  $("#saveRate").onclick=()=>{const r=+$("#rate").value;if(!(r>=0)){toast("اكتب رقم صحيح");return}
    const cp=+$("#cap").value;if(!(cp>=0)){toast("اكتب حد مواصلات صحيح");return}
    const old=S.rate;S.rate=r;S.fareCap=cp;const td=getDay(today());if(td&&td.wage===old&&!td.touched)td.wage=r;save();render();toast("اليومية "+fmt(r)+" · حد المواصلات "+fmt(cp)+" ج.م")};
  $("#exp").onclick=async()=>{
    const name="mishwari-backup-"+today()+".json";const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"نسخة مشواري"});return}catch(e){if(e.name==="AbortError")return}}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("اتحفظت النسخة في التنزيلات");
  };
  let pending=null;
  $("#impBtn").onclick=()=>$("#imp").click();
  $("#imp").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.centers)||typeof d.days!=="object")throw 0;pending=d;
    $("#impMsg").textContent=`النسخة فيها ${d.centers.length} سنتر و${Object.keys(d.days).length} يوم سناتر و${(d.tx||[]).length} حركة. هتحل مكان البيانات اللي على الموبايل دلوقتي.`;$("#impConfirm").hidden=false}catch(x){toast("الملف ده مش نسخة من مشواري")}};r.readAsText(f);e.target.value=""};
  $("#impNo").onclick=()=>{pending=null;$("#impConfirm").hidden=true};
  $("#impYes").onclick=()=>{S=loadState(pending);save();render();toast("اتسترجعت النسخة")};
}

/* ================= router ================= */
const FAB={today:["سجل مصروف",()=>txSheet("out")],cafe:["سجل أجل",()=>txSheet("tab")],centers:["ضيف سنتر جديد",()=>centerSheet()]};
function go(v){view=v;if(!$("#sheet").hidden)closeSheet();render();window.scrollTo(0,0)}
function render(){
  $$(".nav button").forEach(b=>b.dataset.v===view?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  $("#fab").hidden=!FAB[view];if(FAB[view])$("#fab").setAttribute("aria-label",FAB[view][0]);
  renderTop();
  ({today:renderToday,cafe:renderCafe,centers:renderCenters,money:renderMoney,settings:renderSettings})[view]();
}
$$(".nav button").forEach(b=>b.onclick=()=>{if(b.dataset.v==="today"&&view==="today")cur=today();if(b.dataset.v==="money"&&view!=="money")anchor=today();go(b.dataset.v)});
$("#fab").onclick=()=>FAB[view]&&FAB[view][1]();
/* refresh the "now" highlight and roll over to a new day */
let lastSeen=today();setInterval(()=>{if(today()!==lastSeen){if(cur===lastSeen)cur=today();lastSeen=today()}if(view==="today"&&$("#sheet").hidden&&!["TEXTAREA","INPUT"].includes(document.activeElement.tagName))render()},60000);
render();
syncReady=true;
ensureSubKeys().then(()=>syncNow(false));

if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("message",e=>{
    if(e.data&&e.data.type==="notification-click"){cur=e.data.date||today();go("today")}
  });
}
</script>
</body>
</html>
